# Folder rules for photos/scripts/organize-media.py, paths relative to the
# archive root it is run on. Copy to <root>/.organize/folder-rules.conf: real
# rules name private folders and stay out of this repository. Only needed where a file's own metadata cannot say
# where or when it was taken; phones with GPS and time-zone tags need nothing.
#
#   <folder>  zone  <Area/City>     read zoneless times, and convert UTC video
#                                   times, in this zone instead of the default
#   <folder>  shift <+|-><H>h[<M>m] camera clock was wrong by this much
#   <folder>  date  YYYY-MM-DD      day to use when nothing better exists
#   <folder>  clock local           the camera wrote local time where videos
#                                   should hold UTC (many GoPro and Nikon models)
#
# Rules for deeper folders override those of their parents. Examples:
#
#   FAMILLY/REUNIONS_TRAVELS_TRIPS/2019_PARIS    zone  Europe/Paris
#   FAMILLY/OLD-MEMORIES/NIKON_2012_TRIP         shift +1h
#   FAMILLY/OLD-MEMORIES/OLD_US                  date  2008-07-01
#   MY_PERSONAL_MEMORIES/GOPRO                   clock local
