# Drive file for photos/scripts/import-drive.sh. Copy it to
# ~/.config/batlab-import/<drive>.conf on the machine the drive is plugged into:
# it describes one person's disk, so it is not kept in this repository. The file
# name, without .conf, names the drive in logs and notifications.
#
#   source  <mount point>
#   uuid    <filesystem UUID, from: findmnt -no UUID --mountpoint <mount point>>
#   step    <name> | <folder on the drive>/ | <folder under the data root>/ | [rsync filters]
#
# Folders end in /. Filters are separated by spaces, so match a space in a name
# with ?. Each step copies the folder's contents into the destination.

source  /media/you/PHOTO_DRIVE
uuid    1234-ABCD

step  library    | DCIM/                | photos/inbox/phone-2019/
step  documents  | Documents/Family/    | files/family/            | --exclude=*.tmp
step  notes      | ./                   | files/archives/photo-drive/ | --include=/notes.txt --exclude=*
