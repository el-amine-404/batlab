[Service]
# These scans parse files chosen by whoever made the torrent: containers, fonts,
# cover art, subtitles. Running that as root on the host means a parser bug in
# ffmpeg or file(1) is root on the host. Nothing here needs root — the library
# is potato:potato and clamd is reached through a world-writable socket — so the
# privilege was never doing any work.
#
# Installed as a drop-in rather than written into the units, so removing it is
# one rm and a daemon-reload, and the units underneath are untouched.
User=potato
Group=potato

NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=true
LockPersonality=true

# The scripts live in /home/potato/batlab, so home is readable but not writable.
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/var/lib/batlab-mediascan /mnt/storage/data
PrivateTmp=true
PrivateDevices=true

ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
RestrictNamespaces=true
RestrictRealtime=true

# AF_UNIX reaches clamd, AF_INET is VirusTotal, the Discord webhook and the arr
# APIs. AF_NETLINK is not optional: getaddrinfo enumerates interfaces through it,
# so without it name resolution fails and every outbound call dies.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

# Reports name what is wrong with which file, and nothing else needs to read them.
UMask=0077

# ProtectSystem=strict makes the checkout read-only, and Python would otherwise
# try to drop .pyc files next to the scripts on every run.
Environment=PYTHONDONTWRITEBYTECODE=1

# MemoryDenyWriteExecute is deliberately absent: some codecs allocate executable
# pages and it would break the decode rather than the attack.
