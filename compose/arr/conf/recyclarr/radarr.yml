# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    # The guide's size table has no DVD row, so recyclarr cannot manage it; its
    # 5 MB/min floor is set in Radarr itself (Settings > Quality).
    quality_definition:
      type: movie

    # A film is grabbed in whatever genuine form exists, then upgraded: 720p and
    # DVD are fallbacks below the guide's qualities, and a dub without the
    # original audio is accepted down to min_format_score (see custom_formats).
    quality_profiles:
      - trash_id: d1d310673359205736b4b84acd5ea8c8  # Remux 2160p (Combined)
        name: Movies 4K
        min_format_score: -9000
        reset_unmatched_scores:
          enabled: true
        qualities:
          - name: Remux-2160p
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Remux-1080p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: DVD

      - trash_id: 9ca12ea80aa55ef916e3751f4b874151  # Remux + WEB 1080p
        name: Movies 1080p
        min_format_score: -9000
        reset_unmatched_scores:
          enabled: true
        qualities:
          - name: Remux-1080p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: DVD

    custom_format_groups:
      add:
        - trash_id: 9d5acd8f1da78dfbae788182f7605200  # [Audio] Audio Formats
        - trash_id: ef20e67b95a381fb3bc6d1f06ea24f46  # [HDR Formats] HDR
        # select_all pulls in Scene, Obfuscated, Retags and No-RlsGroup, which
        # the guide ships as opt-in rather than default.
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
          select_all: true
        # Bluray-1080p is absent from the 1080p template, so that profile gets no
        # release-group tiers with it.
        - trash_id: b2f2af430f73f3ad1f9948f33e0f0cf8  # [Release Groups] HQ
          select_all: true
          assign_scores_to:
            - name: Movies 1080p

    custom_formats:
      # Three bands, since no release stacks more than ~7600 positive points
      # (best audio 5000, best tier 1950, HDR 500, extras). Missing original
      # audio costs 9000, so any original release outranks any dub, yet a dub
      # still clears min_format_score -9000 when nothing else exists. Unwanted
      # formats move from the guide's -10000 to -20000 so the lowered minimum
      # can never admit them; one the guide adds to its Unwanted group later
      # arrives at -10000 and must be listed here too, which the sync's
      # "conflicting scores" lines make easy to spot by their absence.
      # An untagged title parses as the original
      # language; a dub like that is only caught after import, from its tracks.
      - trash_ids:
          - d6e9318c875905d6cfb5bee961afcea9  # Language: Not Original
        assign_scores_to:
          - name: Movies 4K
            score: -9000
          - name: Movies 1080p
            score: -9000
      - trash_ids:
          - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
          - cae4ca30163749b891686f95532519bd  # AV1
          - ed38b889b31be83fda192888e2286d83  # BR-DISK
          - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
          - 0a3f082873eb454bde444150b70253cc  # Extras
          - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
          - 90a6f9a284dff5103f6346090e6280c8  # LQ
          - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
          - c465ccc73923871b3eb1802042331306  # Line/Mic Dubbed
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5  # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2  # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f  # Retags
          - f537cf427b64c38c8e36298f657e4828  # Scene
          - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
          - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
        assign_scores_to:
          - name: Movies 4K
            score: -20000
          - name: Movies 1080p
            score: -20000
      - trash_ids:
          - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
        assign_scores_to:
          - name: Movies 4K
            score: -20000
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
        assign_scores_to:
          - name: Movies 1080p
            score: -20000
      # Extra dubs rank English, then French, then Arabic. English alone
      # outscores French and Arabic together; all three stay below one audio
      # format step, so a dub never outranks a better release.
      - trash_ids:
          - c11d21efd423ff6a0f9daaf35688f9cb  # Audio: English
        assign_scores_to:
          - name: Movies 4K
            score: 60
          - name: Movies 1080p
            score: 60
      - trash_ids:
          - a44ba0ad6885efc42f49413988de9870  # Audio: French
        assign_scores_to:
          - name: Movies 4K
            score: 30
          - name: Movies 1080p
            score: 30
      - trash_ids:
          - 351897c0630b18cf8df0195c9cbf471e  # Audio: Arabic
        assign_scores_to:
          - name: Movies 4K
            score: 15
          - name: Movies 1080p
            score: 15
      # The guide ships channel counts unscored. Small values break ties between
      # two lossless releases without outranking the audio format itself.
      - trash_ids:
          - e77382bcfeba57cb83744c9c5449b401  # 7.1 Surround
        assign_scores_to:
          - name: Movies 1080p
            score: 30
      - trash_ids:
          - 6fd7b090c3f7317502ab3b63cc7f51e3  # 6.1 Surround
        assign_scores_to:
          - name: Movies 1080p
            score: 20
      - trash_ids:
          - 77ff61788dfe1097194fd8743d7b4524  # 5.1 Surround
        assign_scores_to:
          - name: Movies 1080p
            score: 10

    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: true
        standard: jellyfin-tmdb
