# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: d1d310673359205736b4b84acd5ea8c8  # Remux 2160p (Combined)
        name: Movies
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 9d5acd8f1da78dfbae788182f7605200  # [Audio] Audio Formats
        - trash_id: ef20e67b95a381fb3bc6d1f06ea24f46  # [HDR Formats] HDR
        # select_all pulls in Scene, Obfuscated, Retags and No-RlsGroup, which
        # the guide ships as opt-in rather than default.
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
          select_all: true

    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: true
        standard: jellyfin-tmdb
