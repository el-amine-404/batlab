name: potato-arr
services:

  bazarr:
    image: ${IMAGE_BAZARR}:${TAG_BAZARR}
    container_name: bazarr
    volumes:
      - ${VOLUMES_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: [ "CMD", "curl", "-L", "-f", "http://localhost:6767" ]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 60s

  cleanuparr:
    image: ${IMAGE_CLEANUPARR}:${TAG_CLEANUPARR}
    container_name: cleanuparr
    volumes:
      - ${VOLUMES_ROOT}/cleanuparr:/config
      - ${DATA_ROOT}/torrents:/data/torrents:ro
      # Malware Blocker lists of our own: the official blacklist is for video
      # and lists *.flac and *.mp3 (docs/music.md).
      - ${CONFIGS_ROOT}/arr/conf/cleanuparr:/blocklists:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - PORT=${CLEANUPARR_WEBUI_PORT}
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: [ "CMD", "curl", "-L", "-f", "http://localhost:${CLEANUPARR_WEBUI_PORT}" ]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 60s
    cpus: ${CLEANUPARR_CPUS:?set in hosts/<profile>/compose.env}
    mem_limit: ${CLEANUPARR_MEM_LIMIT:?set in hosts/<profile>/compose.env}
    mem_reservation: ${CLEANUPARR_MEM_RESERVATION:?set in hosts/<profile>/compose.env}
    mem_swappiness: 0
    memswap_limit: ${CLEANUPARR_MEM_LIMIT:?set in hosts/<profile>/compose.env}

  # Live TV: pulls the iptv-org playlist through the VPN and hands it to
  # Jellyfin as an HDHomeRun tuner at http://gluetun:9191. All-in-one image:
  # its own Postgres (5432) and Redis (6379) listen inside gluetun's namespace.
  dispatcharr:
    image: ${IMAGE_DISPATCHARR}:${TAG_DISPATCHARR}
    container_name: dispatcharr
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${VOLUMES_ROOT}/dispatcharr:/data
    environment:
      - TZ=${TZ}
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    network_mode: service:gluetun
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Quick Sync for stream profiles that transcode.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?set in hosts/<profile>/compose.env}"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9191/hdhr/discover.json" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    cpus: ${DISPATCHARR_CPUS:?set in hosts/<profile>/compose.env}
    mem_limit: ${DISPATCHARR_MEM_LIMIT:?set in hosts/<profile>/compose.env}
    mem_reservation: ${DISPATCHARR_MEM_RESERVATION:?set in hosts/<profile>/compose.env}

  gluetun:
    image: ${IMAGE_GLUETUN}:${TAG_GLUETUN}
    container_name: gluetun
    volumes:
      - ${VOLUMES_ROOT}/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${GLUETUN_SERVER_COUNTRIES}
      - VPN_PORT_FORWARDING=on
      - TZ=${TZ}
      - BLOCK_MALICIOUS=on
      - BLOCK_ADS=on
      - BLOCK_SURVEILLANCE=on
      - FIREWALL_OUTBOUND_SUBNETS=172.19.0.0/16
      - UPDATER_PERIOD=24h
      - UPDATER_VPN_SERVICE_PROVIDERS=protonvpn
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -qO- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences || echo "FAILED to set qbittorrent listen_port {{PORT}}"'
    networks:
      - home_server
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/gluetun-entrypoint", "healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 60s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    extra_hosts:
      - "lidarr:172.19.10.13"
      - "radarr:172.19.10.12"
      - "readarr:172.19.10.14"
      - "sonarr:172.19.10.11"

  lidarr:
    image: ${IMAGE_LIDARR}:${TAG_LIDARR}
    container_name: lidarr
    volumes:
      - ${VOLUMES_ROOT}/lidarr:/config
      # Same /data view as qBittorrent, slskd and Aurral, so a download is
      # imported by hardlink or move instead of being invisible to Lidarr.
      - ${DATA_ROOT}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      home_server:
        ipv4_address: 172.19.10.13
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8686/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prowlarr:
    image: ${IMAGE_PROWLARR}:${TAG_PROWLARR}
    container_name: prowlarr
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${VOLUMES_ROOT}/prowlarr:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9696/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    network_mode: service:gluetun

  qbittorrent:
    image: ${IMAGE_QBITTORRENT}:${TAG_QBITTORRENT}
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${VOLUMES_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}/torrents:/data/torrents
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    network_mode: service:gluetun
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 131072
      nproc: 8192

  # Soulseek client (docs/music.md). It shares gluetun's network like
  # qBittorrent, so peers only ever see the VPN's address, and it connects to
  # Soulseek only while gluetun reports the tunnel up. gluetun's one forwarded
  # port belongs to qBittorrent, so slskd has no inbound port: it can still
  # download from every peer that accepts connections, which is most of them.
  slskd:
    image: ${IMAGE_SLSKD}:${TAG_SLSKD}
    container_name: slskd
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - SLSKD_HTTP_PORT=${SLSKD_WEBUI_PORT}
      - SLSKD_NO_HTTPS=true
      - SLSKD_REMOTE_CONFIGURATION=false
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME:?set in compose/.env}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD:?set in compose/.env}
      - SLSKD_USERNAME=${SLSKD_WEB_USER:?set in compose/.env}
      - SLSKD_PASSWORD=${SLSKD_WEB_PASS:?set in compose/.env}
      - SLSKD_API_KEY=${SLSKD_API_KEY:?set in compose/.env}
      - SLSKD_DOWNLOADS_DIR=/data/soulseek/complete
      - SLSKD_INCOMPLETE_DIR=/data/soulseek/incomplete
      # Many users refuse peers who share nothing. The Lidarr library is shared
      # read-only; nothing else on the disk is visible to slskd.
      - SLSKD_SHARED_DIR=/data/media/music
      - SLSKD_UPLOAD_SLOTS=5
      - SLSKD_UPLOAD_SPEED_LIMIT=2048
      # Hold the Soulseek connection until gluetun's control server reports the
      # tunnel running (GET /v1/vpn/status is open, see conf/gluetun).
      - SLSKD_VPN=true
      - SLSKD_VPN_GLUETUN_URL=http://127.0.0.1:8000
    volumes:
      - ${VOLUMES_ROOT}/slskd:/app
      - ${DATA_ROOT}/soulseek:/data/soulseek
      - ${DATA_ROOT}/media/music:/data/media/music:ro
    network_mode: service:gluetun
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Hands Lidarr's missing albums to slskd and tells Lidarr to import the
  # result. Its config (with the API keys) is ${VOLUMES_ROOT}/soularr/config.ini,
  # made from conf/soularr/config.ini.example.
  soularr:
    image: ${IMAGE_SOULARR}:${TAG_SOULARR}
    container_name: soularr
    depends_on:
      - lidarr
      - slskd
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - SCRIPT_INTERVAL=600
      - WEBUI_ENABLED=true
      - WEBUI_PORT=${SOULARR_WEBUI_PORT}
    volumes:
      - ${VOLUMES_ROOT}/soularr:/data
      - ${DATA_ROOT}/soulseek:/data/soulseek
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  radarr:
    image: ${IMAGE_RADARR}:${TAG_RADARR}
    container_name: radarr
    volumes:
      - ${VOLUMES_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      home_server:
        ipv4_address: 172.19.10.12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7878/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  readarr:
    image: ${IMAGE_READARR}:${TAG_READARR}
    container_name: readarr
    volumes:
      - ${VOLUMES_ROOT}/readarr:/config
      - ${DATA_ROOT}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      home_server:
        ipv4_address: 172.19.10.14
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8787/ping" ]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 60s

  recyclarr:
    image: ${IMAGE_RECYCLARR}:${TAG_RECYCLARR}
    container_name: recyclarr
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    user: ${PUID}:${PGID}
    networks:
      - home_server
    restart: unless-stopped
    volumes:
      - ${VOLUMES_ROOT}/recyclarr:/config
      - ${CONFIGS_ROOT}/arr/conf/recyclarr:/config/configs:ro
      - ${CONFIGS_ROOT}/arr/conf/recyclarr-local:/config/local:ro
      - ${CONFIGS_ROOT}/arr/conf/recyclarr-local/settings.yml:/config/settings.yml:ro
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=@daily
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}

  sonarr:
    image: ${IMAGE_SONARR}:${TAG_SONARR}
    container_name: sonarr
    volumes:
      - ${VOLUMES_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      home_server:
        ipv4_address: 172.19.10.11
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8989/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  flaresolverr:
    image: ${IMAGE_FLARESOLVERR}:${TAG_FLARESOLVERR}
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only is not possible here: undetected-chromedriver patches its own
    # binary at runtime. cap_drop + no-new-privileges + pids_limit still apply.
    tmpfs:
      - /tmp:size=512m,mode=1777
    pids_limit: 512

networks:
  home_server:
    external: true
    name: home_server
