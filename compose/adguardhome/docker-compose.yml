name: adguardhome
services:
  adguardhome:
    image: ${IMAGE_ADGUARD}:${TAG_ADGUARD}
    container_name: adguardhome
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - ${VOLUMES_ROOT}/adguardhome/conf:/opt/adguardhome/conf
      - ${VOLUMES_ROOT}/adguardhome/data:/opt/adguardhome/work
    network_mode: host
    environment:
      - TZ=${TZ}
    healthcheck:
      # The UI is on 3000; port 80 is Caddy when it runs on the same host, and
      # nothing at all when it does not.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
