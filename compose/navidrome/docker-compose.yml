name: ${NAVIDROME_PROJECT_NAME}
services:
  navidrome:
    image: ${IMAGE_NAVIDROME}:${TAG_NAVIDROME}
    container_name: navidrome
    user: ${PUID}:${PGID}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # No scanning of its own: musicguard asks for a scan once every new
      # file has been checked (compose/musicguard/app/navidrome.py), so nothing
      # unchecked is ever playable. Aurral's account is not an admin, so it
      # cannot start scans either.
      - ND_SCANNER_ENABLED=false
      # Forget files that are gone (an upgrade replaced the MP3 with a FLAC,
      # Lidarr renamed it) instead of listing them greyed out. Moves are
      # matched before the purge, so a moved song keeps its plays and stars.
      # Safe only because the data guard (watchdog/README.md) stops this
      # container while the disk is unmounted: an empty mount would read as
      # every song missing.
      - ND_SCANNER_PURGEMISSING=always
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      # Last.fm Integration
      - ND_LASTFM_APIKEY=${NAVIDROME_LASTFM_APIKEY}
      - ND_LASTFM_SECRET=${NAVIDROME_LASTFM_SECRET}
      - ND_LASTFM_LANGUAGE=en
    volumes:
      - ${VOLUMES_ROOT}/navidrome/data:/data
      # Three libraries (docs/music.md): Lidarr's, Aurral's and the pasted
      # links'. Aurral's sits at the path Aurral itself uses, because Aurral
      # creates that library through Navidrome's API with its own path; inside
      # Navidrome's data folder this leaves only an empty mount point behind.
      # Lidarr's stays at /music, mapped in Aurral (Remote path mappings).
      - ${DATA_ROOT}/media/music:/music:ro
      - ${DATA_ROOT}/media/music-aurral:/data/media/music-aurral:ro
      - ${DATA_ROOT}/media/music-extras:/music-extras:ro
      - /etc/localtime:/etc/localtime:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - home_server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  home_server:
    external: true
    name: home_server
