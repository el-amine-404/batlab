# Seed for $VOLUMES_ROOT/frigate/config/config.yml, copied once by setup.sh.
# Frigate edits the live copy from its Settings UI (and migrates it on
# upgrades), so later changes made here are not picked up by themselves.
#
# The DVR records both cameras around the clock. Frigate watches the rooftop
# (camera_1) for people and keeps only those clips, plus a week of its motion;
# on the street (camera_2) it follows cars and keeps a day of them. See
# docs/cameras.md.

# The config format this file is written in. Without it Frigate assumes an
# old one and "migrates" it, which breaks masks given as fractions.
version: 0.18-0

# Alerts go out through the stack's broker to frigate-notify (Discord).
mqtt:
  enabled: true
  host: mosquitto
  port: 1883

# Caddy terminates the connection and proxies plain HTTP to 8971.
tls:
  enabled: false

auth:
  # Caddy's address on the home_server network: login rate limits then apply
  # to the real client from X-Forwarded-For, not to Caddy.
  trusted_proxies:
    - 172.19.0.0/16

# i5-8350U, UHD 620 (gen 8): VAAPI decodes both H.264 and H.265.
ffmpeg:
  hwaccel_args: preset-vaapi

# Object detection on the UHD 620 with YOLOv9, built by build-model.sh into
# /config/models. It sees people from above and at night far better than the
# SSDLite model bundled in the image.
detectors:
  ov:
    type: openvino
    device: GPU

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/models/yolov9-s-320.onnx
  labelmap_path: /labelmap/coco-80.txt

# Off unless a camera turns them on.
detect:
  enabled: false

record:
  enabled: false

snapshots:
  enabled: false

# Two cameras fit the Live grid; Birdseye would only add an encoder.
birdseye:
  enabled: false

# One DVR connection per stream, shared by the Live view and Frigate itself.
# Hikvision paths: Streaming/Channels/<channel><01 main | 02 sub>.
go2rtc:
  streams:
    camera_1:
      - "rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_HOST}:554/Streaming/Channels/101"
    camera_1_sub:
      - "rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_HOST}:554/Streaming/Channels/102"
    camera_2:
      - "rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_HOST}:554/Streaming/Channels/201"
    camera_2_sub:
      - "rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_DVR_HOST}:554/Streaming/Channels/202"

# Channels 3 and 4 of the DVR have no camera plugged in ("NO VIDEO").
cameras:
  camera_1:
    friendly_name: Rooftop
    ffmpeg:
      inputs:
        # Clips are copied from the main stream, never re-encoded.
        - path: rtsp://127.0.0.1:8554/camera_1
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_1_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 960
      height: 576
      fps: 5
    objects:
      track:
        - person
    # Coordinates are fractions of the frame (x,y pairs), drawn on a 960x576
    # frame from the sub stream; adjust them in Settings > Masks / Zones.
    # Write the frame edge as 1.0, never 1.000: Frigate compares the values
    # as text, takes "1.000" > "1.0" for pixels and rejects the config.
    motion:
      mask:
        timestamp:
          friendly_name: DVR clock overlay
          enabled: true
          coordinates: "0.000,0.020,0.300,0.020,0.300,0.110,0.000,0.110"
        neighbour_plants:
          friendly_name: Neighbour's balcony and plants
          enabled: true
          coordinates: "0.945,0.550,1.0,0.550,1.0,1.0,0.945,1.0"
        camera_label:
          friendly_name: DVR camera name overlay
          enabled: true
          coordinates: "0.700,0.860,0.850,0.860,0.850,0.940,0.700,0.940"
        beyond_walls:
          friendly_name: Sky and neighbouring buildings
          enabled: true
          coordinates: "0.000,0.000,1.0,0.000,1.0,0.550,0.955,0.550,0.955,0.300,0.700,0.180,0.470,0.120,0.460,0.260,0.280,0.260,0.180,0.240,0.000,0.235"
    zones:
      # The roof floor and the tops of its walls. A person counts as in the
      # zone when the bottom of their box (their feet) is inside it.
      roof:
        friendly_name: Roof
        coordinates: "0.000,0.240,0.270,0.260,0.460,0.270,0.470,0.160,0.948,0.333,0.941,0.857,0.914,1.0,0.000,1.0"
        objects:
          - person
    review:
      # A person on the roof is an alert; one seen elsewhere (a neighbour's
      # roof or balcony) is only a detection.
      alerts:
        labels:
          - person
        required_zones:
          - roof
      detections:
        labels:
          - person
    record:
      enabled: true
      continuous:
        days: 0
      # Any motion on the roof, person or not (a hand over the wall). Kept
      # short: when the 20 GB fill up Frigate deletes the oldest recordings of
      # any kind, alerts included. Raise once System > Storage shows room.
      motion:
        days: 3
      alerts:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 30
          mode: all
      detections:
        retain:
          days: 7
          mode: motion
    snapshots:
      enabled: true
      required_zones:
        - roof
      retain:
        default: 30
    # The first entry is what the All Cameras grid plays. The sub stream is
    # H.264 and plays in every browser; the main one is 3K H.265, which
    # Firefox cannot play.
    live:
      streams:
        Sub stream: camera_1_sub
        Main stream: camera_1

  camera_2:
    friendly_name: Street
    ffmpeg:
      inputs:
        # Clips are copied from the main stream (4K H.265), never re-encoded.
        - path: rtsp://127.0.0.1:8554/camera_2
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_2_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 960
      height: 576
      fps: 5
    # Cars only: carwatch (compose/frigate/carwatch) says when car 1 or car 2
    # leaves its spot or comes back.
    objects:
      track:
        - car
    # Fractions of the 960x576 sub stream frame, as on camera_1.
    motion:
      mask:
        timestamp:
          friendly_name: DVR clock overlay
          enabled: true
          coordinates: "0.000,0.030,0.300,0.030,0.300,0.110,0.000,0.110"
        camera_label:
          friendly_name: DVR camera name overlay
          enabled: true
          coordinates: "0.710,0.870,0.840,0.870,0.840,0.940,0.710,0.940"
        buildings:
          friendly_name: Buildings, garden and trees beyond the fence
          enabled: true
          coordinates: "0.385,0.000,1.0,0.000,1.0,0.570,0.845,0.555,0.425,0.255"
    zones:
      # One per parking spot, wide enough for a car parked a little off. A car
      # counts as in the spot when the bottom middle of its box (its front or
      # back bumper, seen from above) is inside it.
      spot_1:
        friendly_name: Car 1's spot
        coordinates: "0.448,0.781,0.563,0.816,0.568,0.990,0.448,0.972"
        objects:
          - car
      spot_2:
        friendly_name: Car 2's spot
        coordinates: "0.563,0.816,0.658,0.851,0.658,1.0,0.568,1.0"
        objects:
          - car
    review:
      # No alerts: frigate-notify posts every alert as "Person on the roof",
      # and carwatch already tells. Every car is a detection.
      alerts:
        enabled: false
      detections:
        labels:
          - car
    # A day of everything: clips of the cars that move, and their snapshots
    # (the pictures a classifier for car 3 would learn from).
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 0
      detections:
        pre_capture: 5
        post_capture: 5
        retain:
          days: 1
          mode: motion
    snapshots:
      enabled: true
      retain:
        default: 1
    live:
      streams:
        Sub stream: camera_2_sub
        # 4K H.265.
        Main stream: camera_2
