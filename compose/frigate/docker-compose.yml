name: ${FRIGATE_PROJECT_NAME}
# Frigate NVR in front of the Hikvision DVR (docs/cameras.md). The live config
# is $VOLUMES_ROOT/frigate/config/config.yml, edited from Frigate's Settings
# UI; compose/frigate/setup.sh seeds it once from config.yml in this directory.
services:
  frigate:
    image: ${IMAGE_FRIGATE}:${TAG_FRIGATE}
    container_name: frigate
    restart: unless-stopped
    # Lets ffmpeg, go2rtc and the database close cleanly on stop.
    stop_grace_period: 30s
    # Decoded frames and logs. Frigate asks for 154 MB with 2 cameras at
    # 960x576 and warns at startup when it is short; raise with more cameras
    # or a bigger detect size.
    shm_size: 256mb
    environment:
      - TZ=${TZ}
      # Substituted into config.yml's {FRIGATE_*} placeholders at startup.
      - FRIGATE_DVR_HOST=${FRIGATE_DVR_HOST:?set in compose/.env}
      - FRIGATE_RTSP_USER=${FRIGATE_RTSP_USER:?set in compose/.env}
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:?set in compose/.env}
    volumes:
      - ${VOLUMES_ROOT}/frigate/config:/config
      # A 20 GB filesystem of its own (setup-storage.sh). media/frigate exists
      # only inside it: without the mount the container fails to start instead
      # of filling the root SSD.
      - type: bind
        source: ${VOLUMES_ROOT}/frigate/media/frigate
        target: /media/frigate
        bind:
          create_host_path: false
      # Recording segments are cached here before they are moved to media.
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
      - /etc/localtime:/etc/localtime:ro
    # The UI and API (8971, with login) are reached through Caddy only; 5000
    # (no login) stays on the home_server network for the Homepage widget.
    # mqtt is the stack's own network, for alerts to frigate-notify.
    networks:
      - home_server
      - mqtt
    # VAAPI decoding on the Intel iGPU. The whole /dev/dri: the card and
    # render node names differ between hosts.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?set in hosts/<profile>/compose.env}"
      - "44"
    mem_limit: ${FRIGATE_MEM_LIMIT:?set in hosts/<profile>/compose.env}
    mem_reservation: ${FRIGATE_MEM_RESERVATION:?set in hosts/<profile>/compose.env}
    memswap_limit: ${FRIGATE_MEM_LIMIT:?set in hosts/<profile>/compose.env}
    cpus: ${FRIGATE_CPUS:?set in hosts/<profile>/compose.env}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Carries Frigate's events to frigate-notify, nothing else (conf/mosquitto.conf).
  mosquitto:
    image: ${IMAGE_MOSQUITTO}:${TAG_MOSQUITTO}
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ${CONFIGS_ROOT}/frigate/conf/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - mqtt
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Posts each alert (a person in the roof zone) to Discord with its snapshot
  # (conf/notify.yml).
  frigate-notify:
    image: ${IMAGE_FRIGATE_NOTIFY}:${TAG_FRIGATE_NOTIFY}
    container_name: frigate-notify
    restart: unless-stopped
    depends_on:
      - frigate
      - mosquitto
    volumes:
      - ${CONFIGS_ROOT}/frigate/conf/notify.yml:/app/config.yml:ro
    environment:
      - TZ=${TZ}
      - FN_ALERTS__DISCORD__WEBHOOK=${DISCORD_WEBHOOK_CAMERAS:?set in compose/.env}
    # mqtt for the broker and Frigate's API; home_server to reach Discord.
    networks:
      - home_server
      - mqtt
    mem_limit: 64m
    read_only: true
    # It also writes its log to a file here; the container log has the same.
    tmpfs:
      - /app/log
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Tells Discord when the cameras give no frames, why, and when they are
  # back (camwatch/camwatch.py). On 2026-10-14 they were dark for hours unseen.
  camwatch:
    image: ${IMAGE_CAMWATCH}:${TAG_CAMWATCH}
    container_name: camwatch
    restart: unless-stopped
    command: ["python", "/app/camwatch.py"]
    user: "10001:10001"
    volumes:
      - ${CONFIGS_ROOT}/frigate/camwatch/camwatch.py:/app/camwatch.py:ro
      # batlab's shared code (lib/batlab-common): its Apprise client. Relative
      # to this file: CONFIGS_ROOT/.. would be read as text, not through
      # CONFIGS_ROOT's symlink, and Docker would mount an empty folder.
      - ../../lib/batlab-common/batlab_common:/opt/batlab-common/batlab_common:ro
    environment:
      - TZ=${TZ}
      - PYTHONDONTWRITEBYTECODE=1
      - FRIGATE_DVR_HOST=${FRIGATE_DVR_HOST:?set in compose/.env}
      - PYTHONPATH=/opt/batlab-common
      # Through Apprise (compose/apprise), to its "cameras" channel.
      - CAMWATCH_NOTIFY_URL=http://apprise:8000/notify/camwatch
    # Frigate's API (5000, no login) and Apprise; the DVR is reached from here
    # through the host, as Frigate reaches it.
    networks:
      - home_server
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > 300)"]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Tells Discord, with a picture of the street, when the Clio 4 or the Ford
  # leaves its spot, and when it is back (carwatch/carwatch.py), from
  # Frigate's events on the broker.
  carwatch:
    # The same Python image as camwatch.
    image: ${IMAGE_CAMWATCH}:${TAG_CAMWATCH}
    container_name: carwatch
    restart: unless-stopped
    depends_on:
      - mosquitto
    command: ["python", "/app/carwatch.py"]
    user: "10001:10001"
    volumes:
      - ${CONFIGS_ROOT}/frigate/carwatch/carwatch.py:/app/carwatch.py:ro
      # Relative to this file, as for camwatch.
      - ../../lib/batlab-common/batlab_common:/opt/batlab-common/batlab_common:ro
    environment:
      - TZ=${TZ}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/opt/batlab-common
      # The zones of camera_2 in config.yml, and who parks there.
      - CARWATCH_SPOTS=spot_1=Clio 4,spot_2=Ford
      - CARWATCH_NOTIFY_URL=http://apprise:8000/notify/carwatch
      - CARWATCH_LINK=http://frigate.homelab.lan
    # mqtt for the broker; home_server for Frigate's pictures and Apprise.
    networks:
      - home_server
      - mqtt
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > 300)"]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  home_server:
    external: true
    name: home_server
  # No route out and no other containers: the broker is reachable only by
  # Frigate, frigate-notify and carwatch.
  mqtt:
    internal: true
