# MQTT broker between Frigate, frigate-notify and carwatch only. It listens on
# the stack's internal network, which no other container joins and which has
# no published port, so anonymous access reaches nothing outside this stack.
listener 1883
allow_anonymous true
# Events are only useful as they happen; nothing to keep across restarts.
persistence false
log_dest stdout
log_type error
log_type warning
