name: ${SONGDROP_PROJECT_NAME:-songdrop}
# Paste a link, get the song (docs/music.md). songdrop takes Spotify links
# (through spotDL, which finds the same song on YouTube Music) and any site
# yt-dlp knows. It only writes into the inbox: musicguard checks each file,
# keeps the audio and clean tags, adds lyrics, and files it under music-extras.
# Nothing it downloads is ever played straight from where it wrote it.
# Videos are videodrop's (compose/videodrop).
#
# It connects directly, not through the VPN: YouTube answers VPN addresses with
# "sign in to confirm you're not a bot".
services:
  # Paste a link, get the song (compose/songdrop/app, docs/music.md):
  # Spotify links through spotDL, any other site yt-dlp knows through yt-dlp,
  # into the inbox, and downloadable for a day. It replaced spotDL's own page
  # on 2026-10-14, and MeTube on 2026-10-18.
  songdrop:
    # The tag names both pins (spotDL and yt-dlp): a bumped pin is a different
    # image, which the nightly updater rebuilds.
    image: local/batlab-songdrop:${TAG_SPOTDL}-yt-dlp-${VERSION_YTDLP}
    build:
      context: ./app
      additional_contexts:
        common: ../../lib/batlab-common
        ui: ../../lib/batlab-ui
      network: host
      args:
        BASE_IMAGE: ${IMAGE_SPOTDL}:${TAG_SPOTDL}
        NODE_IMAGE: ${IMAGE_SONGDROP_NODE}:${TAG_SONGDROP_NODE}
        YTDLP_VERSION: ${VERSION_YTDLP}
    # Rebuild on every `make up`, so code changes are always deployed.
    pull_policy: build
    container_name: songdrop
    # The image's user (spotdl, 1000:1000) owns the home that holds Deno.
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - SONGDROP_PORT=${SONGDROP_HTTP_PORT:?set in compose/.env}
      - SONGDROP_RETENTION_HOURS=24
      # The first connection (Settings, Connect), made when there is none:
      # songs still missing after a download, and what later tries bring
      # back, through Apprise (compose/apprise) to the download-issues
      # channel, beside musicguard's findings.
      - SONGDROP_APPRISE_URL=http://apprise:8000/notify/songdrop
      - SONGDROP_APPRISE_TAG=download-issues
      - SONGDROP_PUBLIC_URL=http://songdrop.homelab.lan
      # First values; the Settings page can change these and more.
      - SONGDROP_OUTPUT_FOLDER=music/songdrop
    volumes:
      # Each download's folder; its songs stay downloadable for a day.
      - ${VOLUMES_ROOT}/songdrop/jobs:/state
      # spotDL's work folder, on the SSD rather than in memory.
      - ${VOLUMES_ROOT}/songdrop/spotdl-temp:/home/spotdl/.config/spotdl/temp
      # The output folder's parent: the folder itself (music/songdrop, musicguard's
      # inbox) is a setting, changed from the page (Settings) or the API.
      - ${DATA_ROOT}/inbox:/output
    tmpfs:
      - /tmp
      - /home/spotdl/.cache
    read_only: true
    healthcheck:
      test: ["CMD", "/opt/songdrop/.venv/bin/python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\"SONGDROP_PORT\"]}/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  home_server:
    external: true
    name: home_server
