db:
  path: diun.db

watch:
  workers: 5
  schedule: "0 3 * * *"
  jitter: 30s
  firstCheckNotif: false
  runOnStartup: true
  compareDigest: true

defaults:
  watchRepo: true
  maxTags: 10
  notifyOn:
    - new
    - update
  sortTags: semver
  excludeTags:
    - dev
  # Release tags only, in the shapes the stacks actually pin: two to four numeric
  # parts (Jellyfin moved to 12.0), linuxserver builds with -lsNNN, and -alpine or
  # -full variants. Nightlies, betas, rc and arch-prefixed tags stay out.
  includeTags:
    - '^v?\d{1,4}(\.\d{1,5}){1,3}$'
    - '^v?\d{1,4}(\.\d{1,5}){1,3}(_v\d+(\.\d+)*)?-ls\d+$'
    - '^v?\d{1,4}(\.\d{1,5}){0,3}-(alpine|full)$'

metrics:
  enabled: false
  addr: ":9090"
  path: /metrics

notif:
  # Through Apprise (compose/apprise) as "diun", to the updates channel. The
  # body carries what Diun's own Discord card had as fields.
  apprise:
    endpoint: http://apprise:8000
    token: diun
    tags:
      - updates
    timeout: 10s
    templateTitle: '{{ .Entry.Image }} {{ if (eq .Entry.Status "new") }}is available{{ else }}has been updated{{ end }}'
    templateBody: |
      Docker tag {{ if .Entry.Image.HubLink }}[**{{ .Entry.Image }}**]({{ .Entry.Image.HubLink }}){{ else }}**{{ .Entry.Image }}**{{ end }} which you subscribed to through {{ .Entry.Provider }} provider has been released.

      **Host**
      {{ .Meta.Hostname }}

      **Created**
      {{ if .Entry.Manifest.Created }}{{ .Entry.Manifest.Created.Format "Jan 02, 2006 15:04 UTC" }}{{ else }}-{{ end }}

      **Platform**
      {{ .Entry.Manifest.Platform }}

      **Digest**
      `{{ .Entry.Manifest.Digest }}`

providers:
  docker:
    watchByDefault: true
