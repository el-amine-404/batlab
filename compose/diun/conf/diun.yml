db:
  path: diun.db

watch:
  workers: 5
  schedule: "0 3 * * *"
  jitter: 30s
  firstCheckNotif: false
  runOnStartup: true
  compareDigest: true

defaults:
  watchRepo: true
  maxTags: 10
  notifyOn:
    - new
    - update
  sortTags: semver
  excludeTags:
    - dev
  # Release tags only, in the shapes the stacks actually pin: two to four numeric
  # parts (Jellyfin moved to 12.0), linuxserver builds with -lsNNN, and -alpine or
  # -full variants. Nightlies, betas, rc and arch-prefixed tags stay out.
  includeTags:
    - '^v?\d{1,4}(\.\d{1,5}){1,3}$'
    - '^v?\d{1,4}(\.\d{1,5}){1,3}(_v\d+(\.\d+)*)?-ls\d+$'
    - '^v?\d{1,4}(\.\d{1,5}){0,3}-(alpine|full)$'

metrics:
  enabled: false
  addr: ":9090"
  path: /metrics

notif:
  discord:
    renderEmbeds: true
    renderFields: true
    timeout: 10s
    templateBody: |
      Docker tag {{ .Entry.Image }} which you subscribed to through {{ .Entry.Provider }} provider has been released.

providers:
  docker:
    watchByDefault: true
