name: netalertx
# Watches the LAN with arp-scan every few minutes and posts to #alerts (through
# Apprise, compose/apprise) when a device it has never seen joins. Host networking is what lets arp-scan reach
# the LAN; the web UI listens only on the home_server gateway, which is how
# Caddy reaches it (like Netdata). Settings in APP_CONF_OVERRIDE are forced on
# every start and cannot be changed in the UI; everything else can. The API
# (GRAPHQL_PORT, all interfaces) is closed to the LAN by ufw; Homepage reads it
# over the home_server gateway with API_TOKEN.
services:
  netalertx:
    image: ${IMAGE_NETALERTX}:${TAG_NETALERTX}
    container_name: netalertx
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN        # arp-scan, nmap
      - NET_RAW          # raw sockets for the scans
      - NET_BIND_SERVICE # nbtscan
      - CHOWN            # root entrypoint chowns /data and /tmp, then drops to 20211
      - SETUID
      - SETGID
    volumes:
      - ${VOLUMES_ROOT}/netalertx:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - "/tmp:mode=1700,uid=0,gid=0,rw,noexec,nosuid,nodev,async,noatime,nodiratime"
    environment:
      - LISTEN_ADDR=${HOME_SERVER_GATEWAY_IP}
      - PORT=${NETALERTX_PORT}
      - GRAPHQL_PORT=${NETALERTX_API_PORT}
      # The defaults plus APPRISE, the publisher that posts to Apprise.
      - LOADED_PLUGINS=['ARPSCAN','AVAHISCAN','CSVBCKP','DBCLNP','DIGSCAN','INTRNT','MAINT','NEWDEV','NBTSCAN','NSLOOKUP','NTFPRCS','SETPWD','SYNC','VNDRPDT','WORKFLOWS','UI','APPRISE']
      # Apprise on the loopback (host networking), as "netalertx", tag alerts.
      # Notify on new devices; down alerts only fire for devices flagged
      # "Alert Down" in the UI.
      - >-
        APP_CONF_OVERRIDE={
        "SCAN_SUBNETS": "['${NETALERTX_SUBNET:?set in hosts/<profile>/compose.env} --interface=${NETALERTX_INTERFACE:?set in hosts/<profile>/compose.env}']",
        "TIMEZONE": "${TZ}",
        "BACKEND_API_URL": "/server",
        "API_TOKEN": "${NETALERTX_API_TOKEN:?set in compose/.env}",
        "APPRISE_RUN": "on_notification",
        "APPRISE_HOST": "http://${HOST_LOOPBACK_IP}:${APPRISE_HTTP_PORT:-8011}/notify/netalertx",
        "APPRISE_TARGETTYPE": "tag",
        "APPRISE_TAG": "alerts",
        "APPRISE_PAYLOAD": "text",
        "NTFPRCS_INCLUDED_SECTIONS": "['new_devices','down_devices','down_reconnected']"
        }
    mem_limit: 1g
    pids_limit: 512
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
