name: ${AI_PROJECT_NAME}
services:

  ollama:
    image: ${IMAGE_OLLAMA}:${TAG_OLLAMA}
    container_name: ollama
    environment:
      - TZ=${TZ}
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:?set in hosts/<profile>/compose.env}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:?set in hosts/<profile>/compose.env}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH}
      - OLLAMA_MAX_QUEUE=64
    volumes:
      - ${VOLUMES_ROOT}/ollama:/root/.ollama
      - /etc/localtime:/etc/localtime:ro
    ports:
      - ${HOST_LOOPBACK_IP}:${OLLAMA_HTTP_PORT}:11434
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    cpus: ${OLLAMA_CPUS:?set in hosts/<profile>/compose.env}
    mem_limit: ${OLLAMA_MEM_LIMIT:?set in hosts/<profile>/compose.env}
    mem_reservation: ${OLLAMA_MEM_RESERVATION:?set in hosts/<profile>/compose.env}
    mem_swappiness: 0
    memswap_limit: ${OLLAMA_MEM_LIMIT:?set in hosts/<profile>/compose.env}

  paperless-gpt:
    image: ${IMAGE_PAPERLESS_GPT}:${TAG_PAPERLESS_GPT}
    container_name: paperless-gpt
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - PAPERLESS_BASE_URL=http://paperless:8000
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - LLM_PROVIDER=ollama
      - LLM_MODEL=${PAPERLESS_GPT_LLM_MODEL}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH}
      - OCR_PROVIDER=${PAPERLESS_GPT_OCR_PROVIDER}
      - VISION_LLM_PROVIDER=${PAPERLESS_GPT_VISION_PROVIDER}
      - VISION_LLM_MODEL=${PAPERLESS_GPT_VISION_MODEL}
      - MANUAL_TAG=${PAPERLESS_GPT_MANUAL_TAG}
      - AUTO_TAG=${PAPERLESS_GPT_AUTO_TAG}
      - AUTO_OCR_TAG=${PAPERLESS_GPT_AUTO_OCR_TAG}
      - LLM_LANGUAGE=${PAPERLESS_GPT_LANGUAGE}
    volumes:
      - ${CONFIGS_ROOT}/ai/conf/prompts:/app/prompts
      - /etc/localtime:/etc/localtime:ro
    ports:
      - ${HOST_LOOPBACK_IP}:${PAPERLESS_GPT_HTTP_PORT}:8080
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  home_server:
    external: true
    name: home_server
