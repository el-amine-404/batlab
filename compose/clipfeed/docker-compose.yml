name: ${CLIPFEED_PROJECT_NAME:-clipfeed}
# What music video communities post, as an API and Atom feeds (docs/music.md):
# every YouTube link of a subreddit's posts, checked with YouTube Music (the
# artist's video, the song, or an upload of a released song?). clipseerr's
# Hot category reads it; any app can. No account and no key: Reddit's public
# feed, PullPush's archive, YouTube Music.
#
# Feeds live in its database and are changed through its API (/api/docs);
# CLIPFEED_FEEDS makes them on the first start only.
services:
  clipfeed:
    image: local/batlab-clipfeed:ytmusicapi-${VERSION_YTMUSICAPI}
    build:
      context: ./app
      additional_contexts:
        common: ../../lib/batlab-common
      network: host
      args:
        BASE_IMAGE: ${IMAGE_CLIPFEED_BASE}:${TAG_CLIPFEED_BASE}
        YTMUSICAPI_VERSION: ${VERSION_YTMUSICAPI}
    # Rebuild on every `make up`, so code changes are always deployed.
    pull_policy: build
    container_name: clipfeed
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - CLIPFEED_PORT=8830
      - CLIPFEED_FEEDS=${CLIPFEED_FEEDS:-sexymusicvideos=reddit:SexyMusicVideos}
    volumes:
      # The database: feeds, the posts they found, YouTube's verdicts.
      - ${VOLUMES_ROOT}/clipfeed:/state
    tmpfs:
      - /tmp
    read_only: true
    healthcheck:
      test: ["CMD", "/opt/clipfeed/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8830/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  home_server:
    external: true
    name: home_server
