name: ${MUSIC_LINKS_PROJECT_NAME}
# Paste a link, get the song (docs/music.md). MeTube takes YouTube and the other
# sites yt-dlp knows; spotDL takes Spotify links and finds the same song on
# YouTube Music; songdrop does both on one page. All only write into the inbox: musicguard checks each file,
# keeps the audio and clean tags, adds lyrics, and files it under music-extras.
# Nothing they download is ever played straight from where they wrote it.
#
# Both connect directly, not through the VPN: YouTube answers VPN addresses with
# "sign in to confirm you're not a bot".
services:
  metube:
    image: ${IMAGE_METUBE}:${TAG_METUBE}
    container_name: metube
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
      - PORT=${METUBE_HTTP_PORT}
      - DOWNLOAD_DIR=/downloads
      - STATE_DIR=/state
      # Partial downloads stay on the SSD; the inbox only ever sees whole files.
      - TEMP_DIR=/state/tmp
      # Everything lands in one inbox folder; no folder picker in the UI.
      - CUSTOM_DIRS=false
      - CLEAR_COMPLETED_AFTER=86400
      - DEFAULT_THEME=auto
      # Per-download yt-dlp options can run commands in the container.
      - ALLOW_YTDL_OPTIONS_OVERRIDES=false
    volumes:
      - ${VOLUMES_ROOT}/metube:/state
      - ${DATA_ROOT}/inbox/music/metube:/downloads
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    mem_limit: 1g

  spotdl:
    # The tag names both pins, so a bump of either changes the image the
    # nightly updater compares against the running one, and it rebuilds.
    image: local/batlab-spotdl:${TAG_SPOTDL}-yt-dlp-${VERSION_YTDLP}
    build:
      context: ./spotdl
      network: host
      args:
        BASE_IMAGE: ${IMAGE_SPOTDL}:${TAG_SPOTDL}
        YTDLP_VERSION: ${VERSION_YTDLP}
    # Rebuild on every `make up`, so a bumped VERSION_YTDLP is always deployed.
    pull_policy: build
    container_name: spotdl
    # The image's own user is 1000:1000 and keeps Deno (yt-dlp's JavaScript
    # runtime) in its home, so nothing is mounted over that home.
    user: "${PUID}:${PGID}"
    command:
      - web
      - --host=0.0.0.0
      - --port=${SPOTDL_HTTP_PORT}
      - --keep-alive
      - --web-use-output-dir
      - --output=/music/{artists} - {title}.{output-ext}
      # YouTube Music's own Opus stream, copied without converting: converting
      # to MP3 would only lose quality.
      - --format=opus
      - --bitrate=disable
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_ROOT}/inbox/music/spotdl:/music
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g

  # Paste a link, get the song (compose/music-links/songdrop, docs/music.md):
  # Spotify links through spotDL, any other site yt-dlp knows through yt-dlp,
  # into the inbox like the two above, and downloadable for a day. Meant to
  # replace MeTube's and spotDL's own pages.
  songdrop:
    # Same tag scheme as spotdl: a bumped pin is a different image, which the
    # nightly updater rebuilds.
    image: local/batlab-songdrop:${TAG_SPOTDL}-yt-dlp-${VERSION_YTDLP}
    build:
      context: ./songdrop
      network: host
      args:
        BASE_IMAGE: ${IMAGE_SPOTDL}:${TAG_SPOTDL}
        NODE_IMAGE: ${IMAGE_SONGDROP_NODE}:${TAG_SONGDROP_NODE}
        YTDLP_VERSION: ${VERSION_YTDLP}
    # Rebuild on every `make up`, so code changes are always deployed.
    pull_policy: build
    container_name: songdrop
    # The image's user (spotdl, 1000:1000) owns the home that holds Deno.
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - SONGDROP_PORT=${SONGDROP_HTTP_PORT:?set in compose/.env}
      - SONGDROP_RETENTION_HOURS=24
      # Songs still missing after a download, and what later tries bring back,
      # to #download-issues beside musicguard's findings.
      - SONGDROP_DISCORD_WEBHOOK=${DISCORD_WEBHOOK_DOWNLOAD_ISSUES:-}
      - SONGDROP_PUBLIC_URL=http://songdrop.homelab.lan
    volumes:
      # Each download's folder; its songs stay downloadable for a day.
      - ${VOLUMES_ROOT}/songdrop/jobs:/state
      # spotDL's work folder, on the SSD rather than in memory.
      - ${VOLUMES_ROOT}/songdrop/spotdl-temp:/home/spotdl/.config/spotdl/temp
      - ${DATA_ROOT}/inbox/music/songdrop:/inbox
    tmpfs:
      - /tmp
      - /home/spotdl/.cache
    read_only: true
    healthcheck:
      test: ["CMD", "/opt/songdrop/.venv/bin/python", "-c", "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\"SONGDROP_PORT\"]}/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - home_server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  home_server:
    external: true
    name: home_server
