name: ${JELLYFIN_PROJECT_NAME}
services:
  jellyfin:
    image: ${IMAGE_JELLYFIN}:${TAG_JELLYFIN}
    container_name: jellyfin
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://jellyfin.homelab.lan
      - JELLYFIN_CONFIG_DIR=/config
      - JELLYFIN_DATA_DIR=/server_data
      - JELLYFIN_LOG_DIR=/log
    volumes:
      - ${VOLUMES_ROOT}/jellyfin/conf:/config
      - ${VOLUMES_ROOT}/jellyfin/data:/server_data
      - ${VOLUMES_ROOT}/jellyfin/cache:/cache
      # A 30 GB filesystem of its own (setup-storage.sh): a live TV stream left
      # open fills it instead of the root SSD. transcodes/transcodes exists only
      # inside it: without the mount the container fails to start.
      - type: bind
        source: ${VOLUMES_ROOT}/jellyfin/transcodes/transcodes
        target: /cache/transcodes
        bind:
          create_host_path: false
      - ${VOLUMES_ROOT}/jellyfin/log:/log
      - ${DATA_ROOT}:/data:ro
      - /etc/localtime:/etc/localtime:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - home_server
    # The whole /dev/dri: the card and render node names differ between hosts.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?set in hosts/<profile>/compose.env}"
      - "44"
networks:
  home_server:
    external: true
    name: home_server
