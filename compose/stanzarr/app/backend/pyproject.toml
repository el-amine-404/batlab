[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stanzarr"
dynamic = ["version"]
description = "Lyrics for your music library, the *arr way: tracks every song's lyrics, fetches them from LRCLIB, syncs them with AI and lets you fix them in an editor."
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "mutagen==1.47.0",
  "numpy==2.2.5",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]

[project.scripts]
stanzarr = "stanzarr.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "stanzarr.__version__" }

[tool.setuptools.packages.find]
include = ["stanzarr*"]

[tool.setuptools.package-data]
stanzarr = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
