# Sourced by Netdata after its stock copy, so only overrides belong here.
SEND_EMAIL="NO"

# The built-in Discord sender posts Slack-formatted text that cannot be styled,
# so alerts go through custom_sender: to Apprise as "netdata on <host>"
# (compose/apprise, its alerts channel), and straight to Discord as a card
# matching Uptime Kuma's when Apprise can't be reached. The |critical modifier
# drops warnings and keeps criticals plus what follows them (a drop back to
# warning, the recovery).

SEND_DISCORD="NO"
SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="discord|critical"

netdata_api() {
  curl -fsS -m 5 "http://127.0.0.1:${NETDATA_LISTENER_PORT:-19999}/api/$1" 2>/dev/null
}

# The three containers using the most of a cgroup context over the last
# $3 seconds: "frigate 140%, jellyfin 60%, ..." for cgroup.cpu (100% is one
# core), "ollama 9.8 GB, ..." for cgroup.mem_usage (MiB in Netdata).
top_containers() {
  netdata_api "v2/data?contexts=$1&dimensions=$2&group_by=instance&aggregation=sum&after=-$3&points=1&time_group=average&format=json2" |
    jq -r --arg ctx "$1" '.result as $r | [$r.labels[1:], $r.data[0][1:]] | transpose
      | map({n: (.[0] | sub("^cgroup_"; "") | sub("\\.[a-z_]+@.*$"; "")), v: (.[1][0] // 0)})
      | sort_by(-.v) | .[:3]
      | map(if $ctx == "cgroup.cpu" then "\(.n) \(.v | round)%" else "\(.n) \(.v * 1.048576 / 100 | round / 10 | tostring | if test("\\.") then . else . + ".0" end) GB" end)
      | join(", ")'
}

# Free space now and its change since an hour ago of a disk_space.* chart.
# GiB as Netdata stores them, shown as GB.
disk_lines() {
  local api now ago avail used reserved
  api="v1/data?chart=${chart}&points=1&format=json"
  now="$(netdata_api "${api}&after=-60" | jq -r '.data[0] | "\(.[1]) \(.[2]) \(.[3] // 0)"')" || return 0
  ago="$(netdata_api "${api}&after=-3660&before=-3600" | jq -r '.data[0][1]')" || return 0
  read -r avail used reserved <<<"${now}"
  [ -n "${avail}" ] && [ "${avail}" != "null" ] || return 0
  awk -v a="${avail}" -v u="${used}" -v r="${reserved}" -v b="${ago}" 'BEGIN {
    g = 1.073741824
    printf "**Free**  %.1f GB of %.0f GB\n", a * g, (a + u + r) * g
    rate = (b - a) * g              # an hour apart
    if (rate > 0.1) {
      printf "**Trend**  filling at %.1f GB/h, full in about ", rate
      h = a * g / rate
      if (h < 1) printf "%d min\n", h * 60; else printf "%.0f h\n", h
    } else if (rate < -0.1) printf "**Trend**  %.1f GB freed in the last hour\n", -rate
    else printf "**Trend**  steady over the last hour\n"
  }'
}

# Available memory, total and swap, from mem.available, system.ram and mem.swap (MiB).
memory_lines() {
  local avail total swap
  avail="$(netdata_api "v1/data?chart=mem.available&after=-60&points=1&format=json" | jq -r '.data[0][1]')"
  total="$(netdata_api "v1/data?chart=system.ram&after=-60&points=1&format=json" | jq -r '.data[0][1:] | add')"
  swap="$(netdata_api "v1/data?chart=mem.swap&after=-60&points=1&format=json" | jq -r '.data[0] | .[2] / (.[1] + .[2]) * 100 | round')"
  [ -n "${avail}" ] && [ "${avail}" != "null" ] &&
    awk -v a="${avail}" -v t="${total}" -v s="${swap}" 'BEGIN {
      printf "**Available**  %.1f GB of %.0f GB, swap %s%% used\n", a * 0.001048576, t * 0.001048576, s }'
}

# Why Docker calls a container unhealthy: its last healthcheck's output, from
# the Docker socket Netdata mounts for its docker collector.
health_lines() {
  local container="$1" state
  state="$(curl -fsS -m 5 --unix-socket /var/run/docker.sock "http://docker/containers/${container}/json" 2>/dev/null)" || return 0
  jq -r '.State.Health // empty | "**Check**  failed \(.FailingStreak) times in a row: \((.Log[-1].Output // "no output") | gsub("\\s+"; " ") | .[0:300])"' <<<"${state}"
  echo "**Logs**  \`docker logs --tail 50 ${container}\`"
}

# A card is a plain title of what happened and the facts to act on: no
# severity label (the stripe's colour), no chart id, no stock description that
# repeats the title.
custom_sender() {
  local title color kind payload httpcode body="" back="" container

  # Apprise's colours (notify.COLOURS), for the card sent straight to Discord.
  case "${status}" in
    CRITICAL) color=10690615 kind=failure ;;
    WARNING) color=13291305 kind=warning ;;
    CLEAR) color=3842871 kind=success back=1 ;;
    *) color=3843043 kind=info ;;
  esac

  case "${name}" in
    disk_space_usage)
      title="Disk ${chart#disk_space.} ${back:+back to }${value_string} full"
      body="$(disk_lines)"
      ;;
    10min_cpu_usage)
      if [ -n "${back}" ]; then
        title="CPU back to ${value_string}"
      else
        title="CPU ${value_string} for 10 minutes"
        body="**Top**  $(top_containers cgroup.cpu '*' 600)"
      fi
      ;;
    ram_in_use)
      title="Memory ${back:+back to }${value_string} used"
      body="$(memory_lines)"
      [ -n "${back}" ] || body="${body}"$'\n'"**Top**  $(top_containers cgroup.mem_usage ram 60)"
      ;;
    batlab_cpu_temperature)
      title="CPU ${back:+back to }${value_string/ Celsius/ °C}"
      [ -n "${back}" ] || body="**Busiest**  $(top_containers cgroup.cpu '*' 300)"
      ;;
    batlab_blocked_processes)
      title="${value_string} stuck on disk I/O for 10 minutes"
      [ -n "${back}" ] && title="Disk I/O unblocked"
      [ -n "${back}" ] || body="**Means**  usually the data disk hung or dropped off USB; the watchdog remounts it"
      ;;
    docker_container_unhealthy)
      container="${chart#docker_local.container_}"
      container="${container%_health_status}"
      if [ -n "${back}" ]; then
        title="${container} healthy again"
      else
        title="${container} unhealthy"
        body="$(health_lines "${container}")"
      fi
      ;;
    batlab_cgroup_memory_limit)
      container="${chart#cgroup_}"
      container="${container%.mem_utilization}"
      if [ -n "${back}" ]; then
        title="${container} memory back to ${value_string} of its limit"
      else
        title="${container} using ${value_string} of its memory limit"
        body="**Risk**  the kernel kills processes in this container if it reaches 100%"
      fi
      ;;
    *)
      title="${summary:-${name}}: ${value_string:-n/a}"
      [ -n "${back}" ] && title="${summary:-${name}} back to normal: ${value_string:-n/a}"
      ;;
  esac
  if [ -n "${back}" ] && [ -n "${non_clear_duration_txt}" ]; then
    body="${body:+${body}$'\n'}**Lasted**  ${non_clear_duration_txt}"
  fi

  payload="$(jq -n --arg title "${title}" --arg body "${body}" --arg kind "${kind}" \
    '{title: $title, body: $body, type: $kind, format: "markdown", tag: "alerts"}')"
  httpcode="$(docurl -X POST -H "Content-Type: application/json" -d "${payload}" "${NETDATA_APPRISE_URL}")"
  if [ "${httpcode}" = "200" ]; then
    info "sent ${status} of '${host}.${chart}.${name}' through apprise"
    return 0
  fi
  # Apprise answered and could not deliver: Discord would refuse it too.
  if [ "${httpcode}" != "000" ] && [ "${httpcode}" -lt 500 ] 2>/dev/null; then
    error "apprise did not deliver ${status} of '${host}.${chart}.${name}': HTTP ${httpcode}."
    return 1
  fi

  payload="$(jq -n \
    --arg title "${title}" \
    --argjson color "${color}" \
    --arg host "${host}" \
    --arg body "${body}" \
    --arg when "$(date -u -d "@${when}" +%Y-%m-%dT%H:%M:%SZ)" \
    '{
      username: ("netdata on " + $host),
      avatar_url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/netdata.png",
      embeds: [{title: $title, url: "http://netdata.homelab.lan", color: $color, description: $body, timestamp: $when}]
    }')"

  httpcode="$(docurl -X POST -H "Content-Type: application/json" -d "${payload}" "${DISCORD_WEBHOOK_ALERTS}")"
  if [ "${httpcode}" = "200" ] || [ "${httpcode}" = "204" ]; then
    info "sent discord card for ${status} of '${host}.${chart}.${name}'"
    return 0
  fi
  error "failed to send discord card for ${status} of '${host}.${chart}.${name}' with HTTP error code ${httpcode}."
  return 1
}
