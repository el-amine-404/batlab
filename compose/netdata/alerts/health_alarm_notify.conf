# Sourced by Netdata after its stock copy, so only overrides belong here.
SEND_EMAIL="NO"

# The built-in Discord sender posts Slack-formatted text that cannot be styled,
# so alerts go through custom_sender: to Apprise as "netdata on <host>"
# (compose/apprise, its alerts channel), and straight to Discord as a card
# matching Uptime Kuma's when Apprise can't be reached. The |critical modifier
# drops warnings and keeps criticals plus their recoveries.
SEND_DISCORD="NO"
SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="discord|critical"

custom_sender() {
  local title color kind payload httpcode body

  case "${status}" in
    CRITICAL) title="Critical: ${summary:-${name}}" color=15158332 kind=failure ;;
    WARNING) title="Warning: ${summary:-${name}}" color=15105570 kind=warning ;;
    CLEAR) title="Recovered: ${summary:-${name}}" color=3066993 kind=success ;;
    *) title="${status}: ${summary:-${name}}" color=9807270 kind=info ;;
  esac

  body="**Value**"$'\n'"${value_string:-n/a}"$'\n\n'"**Chart**"$'\n'"\`${chart}\`"$'\n\n'"**Details**"$'\n'"${info}"
  if [ "${status}" = "CLEAR" ] && [ -n "${non_clear_duration_txt}" ]; then
    body="${body}"$'\n\n'"**Lasted**"$'\n'"${non_clear_duration_txt}"
  fi
  payload="$(jq -n --arg title "${title}" --arg body "${body}" --arg kind "${kind}" \
    '{title: $title, body: $body, type: $kind, format: "markdown", tag: "alerts"}')"
  httpcode="$(docurl -X POST -H "Content-Type: application/json" -d "${payload}" "${NETDATA_APPRISE_URL}")"
  if [ "${httpcode}" = "200" ]; then
    info "sent ${status} of '${host}.${chart}.${name}' through apprise"
    return 0
  fi
  # Apprise answered and could not deliver: Discord would refuse it too.
  if [ "${httpcode}" != "000" ] && [ "${httpcode}" -lt 500 ] 2>/dev/null; then
    error "apprise did not deliver ${status} of '${host}.${chart}.${name}': HTTP ${httpcode}."
    return 1
  fi

  payload="$(jq -n \
    --arg title "${title}" \
    --argjson color "${color}" \
    --arg host "${host}" \
    --arg value "${value_string:-n/a}" \
    --arg chart "${chart}" \
    --arg info "${info}" \
    --arg duration "${non_clear_duration_txt}" \
    --arg recovered "${status}" \
    --arg when "$(date -u -d "@${when}" +%Y-%m-%dT%H:%M:%SZ)" \
    '{
      username: ("netdata on " + $host),
      avatar_url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/netdata.png",
      embeds: [{
        title: $title,
        url: "http://netdata.homelab.lan",
        color: $color,
        fields: ([
          {name: "Host", value: $host, inline: true},
          {name: "Value", value: $value, inline: true},
          {name: "Chart", value: ("`" + $chart + "`"), inline: false},
          {name: "Details", value: $info, inline: false}
        ] + (if $recovered == "CLEAR" and $duration != "" then [{name: "Lasted", value: $duration, inline: true}] else [] end)),
        timestamp: $when
      }]
    }')"

  httpcode="$(docurl -X POST -H "Content-Type: application/json" -d "${payload}" "${DISCORD_WEBHOOK_ALERTS}")"
  if [ "${httpcode}" = "200" ] || [ "${httpcode}" = "204" ]; then
    info "sent discord card for ${status} of '${host}.${chart}.${name}'"
    return 0
  fi
  error "failed to send discord card for ${status} of '${host}.${chart}.${name}' with HTTP error code ${httpcode}."
  return 1
}
