# Sourced by Netdata after its stock copy, so only overrides belong here.
SEND_EMAIL="NO"

# The built-in Discord sender posts Slack-formatted text that cannot be styled,
# so alerts go through custom_sender: to Apprise as "netdata on <host>"
# (compose/apprise, its alerts channel), and straight to Discord as a card
# matching Uptime Kuma's when Apprise can't be reached. The |critical modifier
# drops warnings and keeps criticals plus what follows them (a drop back to
# warning, the recovery).
#
# A card says what happened and what to look at, nothing Netdata-internal: no
# chart id, no stock description that repeats the title ("Total space
# utilization of disk /"). The stripe's colour gives the severity, so the title
# carries no label or emoji.
SEND_DISCORD="NO"
SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="discord|critical"

# Free space now and its change since an hour ago of a disk_space.* chart, as card
# lines, from Netdata's own API. GiB as Netdata stores them, shown as GB.
disk_lines() {
  local api now ago avail used reserved
  api="http://127.0.0.1:${NETDATA_LISTENER_PORT:-19999}/api/v1/data?chart=${chart}&points=1&format=json"
  now="$(curl -fsS -m 5 "${api}&after=-60" 2>/dev/null | jq -r '.data[0] | "\(.[1]) \(.[2]) \(.[3] // 0)"')" || return 0
  ago="$(curl -fsS -m 5 "${api}&after=-3660&before=-3600" 2>/dev/null | jq -r '.data[0][1]')" || return 0
  read -r avail used reserved <<<"${now}"
  [ -n "${avail}" ] && [ "${avail}" != "null" ] || return 0
  awk -v a="${avail}" -v u="${used}" -v r="${reserved}" -v b="${ago}" 'BEGIN {
    g = 1.073741824
    printf "**Free**  %.1f GB of %.0f GB\n", a * g, (a + u + r) * g
    rate = (b - a) * g              # an hour apart
    if (rate > 0.1) {
      printf "**Trend**  filling at %.1f GB/h, full in about ", rate
      h = a * g / rate
      if (h < 1) printf "%d min\n", h * 60; else printf "%.0f h\n", h
    } else if (rate < -0.1) printf "**Trend**  %.1f GB freed in the last hour\n", -rate
    else printf "**Trend**  steady over the last hour\n"
  }'
}

custom_sender() {
  local title color kind payload httpcode body what mount

  what="${summary:-${name}}"
  case "${status}" in
    CRITICAL) color=15158332 kind=failure ;;
    WARNING) color=15105570 kind=warning ;;
    CLEAR) color=3066993 kind=success ;;
    *) color=9807270 kind=info ;;
  esac
  title="${what}: ${value_string:-n/a}"
  [ "${status}" = "CLEAR" ] && title="${what} back to normal: ${value_string:-n/a}"

  body=""
  case "${chart}" in
    disk_space.*)
      mount="${chart#disk_space.}"
      title="Disk ${mount} ${value_string} full"
      [ "${status}" = "CLEAR" ] && title="Disk ${mount} back to ${value_string} full"
      body="$(disk_lines)"
      ;;
  esac
  # Our own alarms' descriptions say what to suspect; the stock ones restate the title.
  case "${name}" in
    batlab_*) body="${body:+${body}$'\n'}**Means**  ${info}" ;;
  esac
  if [ "${status}" = "CLEAR" ] && [ -n "${non_clear_duration_txt}" ]; then
    body="${body:+${body}$'\n'}**Lasted**  ${non_clear_duration_txt}"
  fi

  payload="$(jq -n --arg title "${title}" --arg body "${body}" --arg kind "${kind}" \
    '{title: $title, body: $body, type: $kind, format: "markdown", tag: "alerts"}')"
  httpcode="$(docurl -X POST -H "Content-Type: application/json" -d "${payload}" "${NETDATA_APPRISE_URL}")"
  if [ "${httpcode}" = "200" ]; then
    info "sent ${status} of '${host}.${chart}.${name}' through apprise"
    return 0
  fi
  # Apprise answered and could not deliver: Discord would refuse it too.
  if [ "${httpcode}" != "000" ] && [ "${httpcode}" -lt 500 ] 2>/dev/null; then
    error "apprise did not deliver ${status} of '${host}.${chart}.${name}': HTTP ${httpcode}."
    return 1
  fi

  payload="$(jq -n \
    --arg title "${title}" \
    --argjson color "${color}" \
    --arg host "${host}" \
    --arg body "${body}" \
    --arg when "$(date -u -d "@${when}" +%Y-%m-%dT%H:%M:%SZ)" \
    '{
      username: ("netdata on " + $host),
      avatar_url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/netdata.png",
      embeds: [{title: $title, url: "http://netdata.homelab.lan", color: $color, description: $body, timestamp: $when}]
    }')"

  httpcode="$(docurl -X POST -H "Content-Type: application/json" -d "${payload}" "${DISCORD_WEBHOOK_ALERTS}")"
  if [ "${httpcode}" = "200" ] || [ "${httpcode}" = "204" ]; then
    info "sent discord card for ${status} of '${host}.${chart}.${name}'"
    return 0
  fi
  error "failed to send discord card for ${status} of '${host}.${chart}.${name}' with HTTP error code ${httpcode}."
  return 1
}
