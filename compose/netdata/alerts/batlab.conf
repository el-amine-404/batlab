# Processes stuck in uninterruptible I/O. Nine of them sat there for six days
# after the USB data disk dropped, while every stock alert stayed at warning.
 alarm: batlab_blocked_processes
    on: system.processes
lookup: min -10m unaligned absolute of blocked
 units: processes
 every: 1m
  warn: $this >= 2
  crit: $this >= 5
 delay: down 5m
  info: processes blocked on I/O for 10 minutes, usually a hung or vanished disk
    to: sysadmin

# The laptop has no battery and shut off after four hours at 82-91 C with no
# log. Five-minute averages reached 87 C that morning, 2.5 hours before.
 template: batlab_cpu_temperature
       on: system.hw.sensor.temperature.input
chart labels: driver=k10temp
   lookup: average -5m unaligned of input
    units: Celsius
    every: 1m
     warn: $this > (($status >= $WARNING)  ? (75) : (80))
     crit: $this > (($status == $CRITICAL) ? (80) : (85))
    delay: down 10m multiplier 1.5 max 1h
  summary: CPU temperature
     info: CPU temperature averaged over 5 minutes; the laptop has powered off from sustained heat before
       to: sysadmin
