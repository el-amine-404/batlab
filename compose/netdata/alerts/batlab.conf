# Processes stuck in uninterruptible I/O. Nine of them sat there for six days
# after the USB data disk dropped, while every stock alert stayed at warning.
# On 2026-10-10 a hung disk kept 3-8 blocked for ten hours; at crit >= 5 the
# first Discord card came six hours late, and it "recovered" at 1-2 blocked
# with the disk still dead. In the week before, the 10-minute minimum was
# never above 0, so 2 goes critical and it stays critical until none are left.
 alarm: batlab_blocked_processes
    on: system.processes
summary: Processes stuck on disk I/O
lookup: min -10m unaligned absolute of blocked
 units: processes
 every: 1m
  warn: $this >= 1
  crit: ($status == $CRITICAL) ? ($this >= 1) : ($this >= 2)
 delay: down 5m
  info: processes blocked on I/O for 10 minutes, usually a hung or vanished disk
    to: sysadmin

# A container can exhaust its own cgroup while the host still has plenty of
# memory. Warn in Netdata at 85%; page after it averages 95% for a minute.
# watchdog/oom_watch.py sends the definitive card if the kernel kills one.
 template: batlab_cgroup_memory_limit
       on: cgroup.mem_utilization
   lookup: average -1m unaligned of utilization
    units: %
    every: 10s
     warn: $this > (($status >= $WARNING) ? (80) : (85))
     crit: $this > (($status == $CRITICAL) ? (90) : (95))
    delay: up 1m down 5m multiplier 1.5 max 1h
  summary: Container memory limit
     info: The container is close to its configured memory limit
       to: sysadmin
