# Processes stuck in uninterruptible I/O. Nine of them sat there for six days
# after the USB data disk dropped, while every stock alert stayed at warning.
 alarm: batlab_blocked_processes
    on: system.processes
lookup: min -10m unaligned absolute of blocked
 units: processes
 every: 1m
  warn: $this >= 2
  crit: $this >= 5
 delay: down 5m
  info: processes blocked on I/O for 10 minutes, usually a hung or vanished disk
    to: sysadmin
