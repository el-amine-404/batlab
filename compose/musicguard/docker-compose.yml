name: ${MUSICGUARD_PROJECT_NAME}
# Checks every music file before anyone plays it (app/guard.py, docs/music.md):
# files from pasted links (MeTube, spotDL) are identified (Shazam), rebuilt and
# filed into music-extras; new files in Aurral's and the extras library are
# rebuilt where they are, Lidarr's are verified and get MusicBrainz's full
# artist credits. Rejected files go to .quarantine/musicguard with a note
# saying why. Nothing is deleted.
#
# It parses files chosen by strangers, so it runs unprivileged, read-only, with
# no capabilities, and sees only the music folders. It needs the internet for
# lyrics, MusicBrainz, Shazam fingerprints and Discord, and Lidarr's API to
# hand it the songs from links (app/upgrade.py), so it joins home_server.
services:
  musicguard:
    image: local/batlab-musicguard
    build:
      context: .
      # Same reason as tv-remote: the builder's DNS on lab2 needs the host network.
      network: host
      args:
        BASE_IMAGE: ${IMAGE_MUSICGUARD_BASE}:${TAG_MUSICGUARD_BASE}
        RUST_IMAGE: ${IMAGE_MUSICGUARD_RUST}:${TAG_MUSICGUARD_RUST}
        SONGREC_VERSION: ${VERSION_SONGREC}
    # Rebuild on every `make up`, so code changes are always deployed.
    pull_policy: build
    container_name: musicguard
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      # Work files on the SSD rather than in memory: a FLAC can be 100 MB.
      - TMPDIR=/state/tmp
      # SongRec keeps a little state in its home; the image is read-only.
      - HOME=/state/home
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_DOWNLOAD_ISSUES:-}
      # "Ready to play in Navidrome", after the scan that indexed new music.
      # Lidarr's own import message is off: it came before the checks, when
      # the music was not playable yet.
      - MUSICGUARD_READY_WEBHOOK=${DISCORD_WEBHOOK_DOWNLOADS:-}
      # The host's clamd (installed for mediascan). Files are held in the
      # inbox, not passed, while it is down.
      - CLAMD_SOCKET=/run/clamav/clamd.ctl
      - CLAMD_REQUIRED=1
      # Lyrics are Stanzarr's job (compose/stanzarr); musicguard still checks
      # lyrics files and starts Navidrome's scan when they change.
      - MUSICGUARD_LYRICS=0
      # Songs from links are handed to Lidarr, which fetches their album.
      - MUSICGUARD_LIDARR_URL=http://lidarr:8686
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      # Navidrome scans only when musicguard asks (an admin account).
      - NAVIDROME_URL=http://navidrome:4533
      - NAVIDROME_USER=${NAVIDROME_MUSICGUARD_USER:-}
      - NAVIDROME_PASSWORD=${NAVIDROME_MUSICGUARD_PASSWORD:-}
    volumes:
      - ${VOLUMES_ROOT}/musicguard:/state
      - ${DATA_ROOT}/inbox/music:/inbox
      - ${DATA_ROOT}/media/music:/data/media/music
      - ${DATA_ROOT}/media/music-aurral:/data/media/music-aurral
      - ${DATA_ROOT}/media/music-extras:/data/media/music-extras
      - ${DATA_ROOT}/.quarantine/musicguard:/quarantine
      # The directory, not the socket: clamd recreates the socket on restart,
      # and a bind-mounted socket file would keep pointing at the old one.
      - /run/clamav:/run/clamav:ro
    networks:
      - home_server
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  home_server:
    external: true
    name: home_server
