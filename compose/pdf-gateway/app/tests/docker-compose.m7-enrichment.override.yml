# Enables optional enrichment on the M4 gate stack for test_m7_enrichment.sh.
services:
  api:
    environment:
      PDF_GATEWAY_ENRICHMENT_ENABLED: "true"
    volumes:
      # Validated clean copies, for the laptop's OCR before a document is archived (as in production).
      - ${TEST_STORAGE}/cdr-output:/data/cdr-output:ro
  archive-worker:
    environment:
      PDF_GATEWAY_ENRICHMENT_ENABLED: "true"
      PDF_GATEWAY_AI_BREAKER_FAILURES: "3"
