name: ${HOMEPAGE_PROJECT_NAME}
services:
  homepage:
    image: ${IMAGE_HOMEPAGE}:${TAG_HOMEPAGE}
    container_name: homepage
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - ${HOST_LOOPBACK_IP}:${HOMEPAGE_HTTP_PORT}:3000
    volumes:
      - ${CONFIGS_ROOT}/homepage/conf:/app/config:ro
      - ${VOLUMES_ROOT}/homepage/icons:/app/public/icons
      - ${VOLUMES_ROOT}/homepage/images:/app/public/images
      - ${VOLUMES_ROOT}/homepage/logs:/app/config/logs
      - /etc/localtime:/etc/localtime:ro
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.homelab.lan
      - HOMEPAGE_VAR_JELLYFIN_KEY=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_IMMICH_KEY=${IMMICH_API_KEY:-}
      - HOMEPAGE_VAR_SEERR_KEY=${SEERR_API_KEY}
      - HOMEPAGE_VAR_SONARR_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_LIDARR_KEY=${LIDARR_API_KEY}
      - HOMEPAGE_VAR_READARR_KEY=${READARR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_KEY=${PROWLARR_API_KEY}
      - HOMEPAGE_VAR_BAZARR_KEY=${BAZARR_API_KEY}
      - HOMEPAGE_VAR_QBIT_USER=${QBIT_USER}
      - HOMEPAGE_VAR_QBIT_PASS=${QBIT_PASS}
      - HOMEPAGE_VAR_ADGUARD_USER=${ADGUARD_USER}
      - HOMEPAGE_VAR_ADGUARD_PASS=${ADGUARD_PASS}
      - HOMEPAGE_VAR_PORTAINER_KEY=${PORTAINER_API_KEY}
      - HOMEPAGE_VAR_FILEBROWSER_USER=${FILEBROWSER_USER}
      - HOMEPAGE_VAR_FILEBROWSER_PASS=${FILEBROWSER_PASS}
      - HOMEPAGE_VAR_NAVIDROME_USER=${NAVIDROME_USER}
      - HOMEPAGE_VAR_NAVIDROME_TOKEN=${NAVIDROME_TOKEN}
      - HOMEPAGE_VAR_NAVIDROME_SALT=${NAVIDROME_SALT}
      - HOMEPAGE_VAR_PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - home_server
    mem_limit: ${HOMEPAGE_MEM_LIMIT:?set in hosts/<profile>/compose.env}
    mem_reservation: ${HOMEPAGE_MEM_RESERVATION:?set in hosts/<profile>/compose.env}
    memswap_limit: ${HOMEPAGE_MEM_LIMIT:?set in hosts/<profile>/compose.env}
    mem_swappiness: 0
    cpus: ${HOMEPAGE_CPUS:?set in hosts/<profile>/compose.env}
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
      nproc: 4096
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--no-check-certificate",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  home_server:
    external: true
    name: home_server
