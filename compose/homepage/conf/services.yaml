---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
- Media:
    - Immich:
        icon: immich
        href: http://immich.homelab.lan
        description: Family Photos & Videos
        siteMonitor: http://immich-server:2283/api/server/ping
        statusStyle: "dot"
        widget:
          type: immich
          url: http://immich-server:2283
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2
          fields: ["users", "photos", "videos", "storage"]
    - Seerr:
        icon: jellyseerr
        href: http://seerr.homelab.lan
        description: Request Movies & Shows
        siteMonitor: http://seerr:5055/api/v1/status
        statusStyle: "dot"
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
          fields: ["pending", "approved", "completed"]
    - Stanzarr:
        icon: mdi-script-text
        href: http://stanzarr.homelab.lan
        description: Lyrics for the Library
        siteMonitor: http://stanzarr:6868/health
        statusStyle: "dot"
    - Feishin:
        icon: mdi-headphones
        href: http://feishin.homelab.lan
        description: Music Player for Navidrome
        siteMonitor: http://feishin:9180
        statusStyle: "dot"
    - Aurral:
        icon: mdi-music-circle
        href: http://aurral.homelab.lan
        description: Request & Discover Music
        siteMonitor: http://aurral:3001
        statusStyle: "dot"
    - Jellyfin:
        icon: jellyfin
        href: http://jellyfin.homelab.lan
        description: Software Media System
        siteMonitor: http://jellyfin:8096
        statusStyle: "dot"
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          # Jellyfin 12 removed the /emby API that version 1 of the widget calls.
          version: 2
          enableBlocks: true
          enableNowPlaying: true
    - Dispatcharr:
        icon: dispatcharr
        href: http://dispatcharr.homelab.lan
        description: Live TV Channels
        siteMonitor: http://gluetun:9191/hdhr/discover.json
        statusStyle: "dot"
    - NodeCast TV:
        icon: mdi-television-play
        href: http://nodecast.homelab.lan
        description: Live TV in the Browser
        siteMonitor: http://nodecast:3000/api/auth/setup-required
        statusStyle: "dot"
    - Navidrome:
        icon: navidrome
        href: http://navidrome.homelab.lan
        description: Music Server
        siteMonitor: http://navidrome:4533/ping
        statusStyle: "dot"
        widget:
          type: navidrome
          url: http://navidrome:4533
          user: "{{HOMEPAGE_VAR_NAVIDROME_USER}}"
          token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
          salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
    - MeTube:
        icon: metube
        href: http://metube.homelab.lan
        description: Paste a YouTube link, get the song
        siteMonitor: http://metube:8081
        statusStyle: "dot"
        # No MeTube widget in Homepage; its /history lists each queue.
        widget:
          type: customapi
          url: http://metube:8081/history
          refreshInterval: 30000
          mappings:
            - field: queue
              label: Downloading
              format: size
            - field: pending
              label: Waiting
              format: size
            - field: done
              label: Done
              format: size
    - songdrop:
        icon: mdi-music-circle
        href: http://songdrop.homelab.lan
        description: Paste a Spotify or YouTube link, get the song
        siteMonitor: http://songdrop:8810/api/v1/health
        statusStyle: "dot"
    - clipseerr:
        icon: mdi-music-box-multiple
        href: http://clipseerr.homelab.lan
        description: The newest music videos; ask for the song or the video
        siteMonitor: http://clipseerr:8820/api/v1/health
        statusStyle: "dot"

- Library:
    - Sonarr:
        icon: sonarr
        href: http://sonarr.homelab.lan
        description: TV Show Management
        siteMonitor: http://sonarr:8989
        statusStyle: "dot"
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          enableQueue: true
    - Radarr:
        icon: radarr
        href: http://radarr.homelab.lan
        description: Movie Management
        siteMonitor: http://radarr:7878
        statusStyle: "dot"
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          enableQueue: true
    - Bazarr:
        icon: bazarr
        href: http://bazarr.homelab.lan
        description: Subtitle Manager
        siteMonitor: http://bazarr:6767
        statusStyle: "dot"
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
    - Lidarr:
        icon: lidarr
        href: http://lidarr.homelab.lan
        description: Music Management
        siteMonitor: http://lidarr:8686
        statusStyle: "dot"
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"
    - Readarr:
        icon: readarr
        href: http://readarr.homelab.lan
        description: Book Management
        siteMonitor: http://readarr:8787
        statusStyle: "dot"
        widget:
          type: readarr
          url: http://readarr:8787
          key: "{{HOMEPAGE_VAR_READARR_KEY}}"

- Downloads:
    - Prowlarr:
        icon: prowlarr
        href: http://prowlarr.homelab.lan
        description: Indexer Manager
        siteMonitor: http://gluetun:9696/ping
        statusStyle: "dot"
        widget:
          type: prowlarr
          url: http://gluetun:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
    - qBittorrent:
        icon: qbittorrent
        href: http://qbittorrent.homelab.lan
        description: Torrent Client
        siteMonitor: http://gluetun:8080
        statusStyle: "dot"
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"
    - slskd:
        icon: slskd
        href: http://slskd.homelab.lan
        description: Soulseek Client (via VPN)
        siteMonitor: http://gluetun:5030/health
        statusStyle: "dot"
        widget:
          type: slskd
          url: http://gluetun:5030
          key: "{{HOMEPAGE_VAR_SLSKD_KEY}}"
          fields: ["slskStatus", "downloads", "uploads", "sharedFiles"]
    - Soularr:
        icon: mdi-music-note-plus
        href: http://soularr.homelab.lan
        description: Lidarr's missing albums from Soulseek
        siteMonitor: http://soularr:8265
        statusStyle: "dot"
    - Cleanuparr:
        icon: cleanuparr
        href: http://cleanuparr.homelab.lan
        description: Download Queue Cleaner
        siteMonitor: http://cleanuparr:11011
        statusStyle: "dot"

- Network:
    - AdGuard Home:
        icon: adguard-home
        href: http://adh.homelab.lan
        description: Ad Blocking, DNS and DHCP .4-.100 (lab1, edit here)
        siteMonitor: http://192.168.1.3:3000
        statusStyle: "dot"
        widget:
          type: adguard
          url: http://192.168.1.3:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"
    - NetAlertX:
        icon: netalertx
        href: http://netalertx.homelab.lan
        description: New devices on the network, to Discord
        siteMonitor: http://172.19.0.1:20211
        statusStyle: "dot"
        widget:
          type: netalertx
          # Version 2 reads the backend API (NetAlertX after 26.1.17).
          url: http://172.19.0.1:20212
          key: "{{HOMEPAGE_VAR_NETALERTX_KEY}}"
          version: 2
    - TV Remote:
        icon: mdi-remote-tv
        href: http://tv.homelab.lan
        description: Remote for the Samsung TV
    - AdGuard Home 2:
        icon: adguard-home
        href: http://adh2.homelab.lan
        description: Backup DNS, DHCP .101-.200 (lab2, synced copy)
        siteMonitor: http://192.168.1.201:3000
        statusStyle: "dot"
        widget:
          type: adguard
          url: http://192.168.1.201:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"
    - Gluetun:
        icon: gluetun
        href: http://qbittorrent.homelab.lan
        description: VPN Gateway
        siteMonitor: http://gluetun:8000/v1/publicip/ip
        statusStyle: "dot"
        widget:
          type: gluetun
          url: http://gluetun:8000

- System:
    - Portainer:
        icon: portainer
        href: http://portainer.homelab.lan
        description: Container Management
        siteMonitor: http://portainer-ce:9000
        statusStyle: "dot"
        widget:
          type: portainer
          url: http://portainer-ce:9000
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"
    - Uptime Kuma:
        icon: uptime-kuma
        href: http://uptimekuma.homelab.lan/status/potato-homelab
        description: Service Monitor
        siteMonitor: http://uptime-kuma:3001
        statusStyle: "dot"
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: potato-homelab
    - Netdata:
        icon: netdata
        href: http://netdata.homelab.lan
        description: Host Monitoring & Alerts
        siteMonitor: http://172.19.0.1:19999/api/v1/info
        statusStyle: "dot"
        widget:
          type: netdata
          url: http://172.19.0.1:19999
    - Dozzle:
        icon: dozzle
        href: http://dozzle.homelab.lan
        description: Real-time Log Viewer
        siteMonitor: http://dozzle:8080
        statusStyle: "dot"
    - Apprise:
        icon: apprise
        # No page: an API only (compose/apprise), so the dot is its health.
        description: Sends every message (Discord channels)
        siteMonitor: http://apprise:8000/status
        statusStyle: "dot"

- Utilities:
    - Frigate:
        icon: frigate
        href: http://frigate.homelab.lan
        description: Home cameras, live view
        siteMonitor: http://frigate:5000
        statusStyle: "dot"
        widget:
          type: frigate
          # Port 5000 has no login and is only reachable on home_server.
          url: http://frigate:5000
    - FileBrowser:
        icon: filebrowser
        href: http://filebrowser.homelab.lan
        description: Web File Manager
        siteMonitor: http://filebrowser:80
        statusStyle: "dot"
        widget:
          type: filebrowser
          url: http://filebrowser:80
          username: "{{HOMEPAGE_VAR_FILEBROWSER_USER}}"
          password: "{{HOMEPAGE_VAR_FILEBROWSER_PASS}}"
    - Paperless:
        icon: paperless-ngx
        href: http://paperless.homelab.lan
        description: Documents & OCR
        siteMonitor: http://paperless:8000
        statusStyle: "dot"
        widget:
          type: paperlessngx
          url: http://paperless:8000
          key: "{{HOMEPAGE_VAR_PAPERLESS_API_TOKEN}}"
    - Paperless-GPT:
        icon: mdi-file-document-edit
        href: http://paperless-gpt.homelab.lan
        description: LLM OCR & Tagging
        siteMonitor: http://paperless-gpt:8080
        statusStyle: "dot"
    - Ollama:
        icon: ollama
        description: Local LLM Runtime
        ping: http://ollama:11434
        statusStyle: "dot"
    - Open WebUI:
        icon: open-webui
        href: http://open-webui.homelab.lan
        description: Private Local AI Chat
        siteMonitor: http://open-webui:8080/health
        statusStyle: "dot"
    - Gotenberg:
        icon: gotenberg
        href: http://gotenberg.homelab.lan
        description: PDF Conversion API
        ping: http://gotenberg:3000
        statusStyle: "dot"
