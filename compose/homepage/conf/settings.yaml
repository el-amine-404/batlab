---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

disableIndexing: true

title: Potato homelab

# Same boxes in a row line up; the dot on every service is set here once.
headerStyle: boxed
useEqualHeights: true
statusStyle: dot
hideVersion: true

# Dark slate with frosted cards; the glow behind them is in custom.css.
theme: dark
color: slate
cardBlur: sm

# Type on the page to jump to a service; descriptions are searched too.
quicklaunch:
  searchDescriptions: true
  hideVisitURL: true

# Groups in services.yaml order, then the bookmark groups. A tab shows only
# its own groups; no group shares a tab's name, so nothing reads twice.
layout:
  Movies & TV:
    tab: Entertainment
    icon: mdi-movie-open
    style: row
    columns: 3
  Music:
    tab: Entertainment
    icon: mdi-music
    style: row
    columns: 3
  Get music:
    tab: Entertainment
    icon: mdi-music-note-plus
    style: row
    columns: 4
  Feeds:
    tab: Entertainment
    icon: mdi-rss
    style: row
    columns: 4
  Photos & files:
    tab: Home
    icon: mdi-image-multiple
    style: row
    columns: 3
  # Two small groups side by side rather than two near-empty rows.
  House:
    tab: Home
    icon: mdi-home
  AI:
    tab: Home
    icon: mdi-robot
  Managers:
    tab: Downloads
    icon: mdi-bookshelf
    style: row
    columns: 3
  Downloaders:
    tab: Downloads
    icon: mdi-download
    style: row
    columns: 3
  Network:
    tab: Lab
    icon: mdi-lan
    style: row
    columns: 3
  System:
    tab: Lab
    icon: mdi-server
    style: row
    columns: 4
  Backends:
    tab: Lab
    icon: mdi-api
    style: row
    columns: 5
    initiallyCollapsed: true
  Web:
    tab: Home
    style: row
    columns: 3
  Links:
    tab: Lab
    style: row
    columns: 4
  Guides:
    tab: Lab
    style: row
    columns: 4
  Discover:
    tab: Lab
    style: row
    columns: 4
