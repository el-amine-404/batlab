---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

disableIndexing: true

title: Potato homelab

# Same boxes in a row line up; the dot on every service is set here once.
headerStyle: boxed
useEqualHeights: true
statusStyle: dot
hideVersion: true

# Dark slate with frosted cards; the glow behind them is in custom.css.
theme: dark
color: slate
cardBlur: sm

# Type on the page to jump to a service; descriptions are searched too.
quicklaunch:
  searchDescriptions: true
  hideVisitURL: true

# Groups in services.yaml order, then the bookmark groups. A tab shows only
# its own groups: Apps for every day, Media for the arr stack, Lab for the rest.
layout:
  Watch:
    tab: Apps
    icon: mdi-movie-open
    style: row
    columns: 4
  Music:
    tab: Apps
    icon: mdi-music
    style: row
    columns: 4
  Home:
    tab: Apps
    icon: mdi-home
    style: row
    columns: 3
  Library:
    tab: Media
    icon: mdi-bookshelf
    style: row
    columns: 3
  Downloads:
    tab: Media
    icon: mdi-download
    style: row
    columns: 3
  Network:
    tab: Lab
    icon: mdi-lan
    style: row
    columns: 3
  System:
    tab: Lab
    icon: mdi-server
    style: row
    columns: 4
  Backends:
    tab: Lab
    icon: mdi-api
    style: row
    columns: 5
    initiallyCollapsed: true
  Web:
    tab: Apps
    style: row
    columns: 3
  Links:
    tab: Lab
    style: row
    columns: 4
  Guides:
    tab: Lab
    style: row
    columns: 4
  Discover:
    tab: Lab
    style: row
    columns: 4
