---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- greeting:
    text_size: xl
    text: Potato homelab

# One line, no labels: CPU, memory, temperature and the media disk
# (/mnt/storage, mounted read-only in docker-compose.yml). Netdata has the rest.
- resources:
    cpu: true
    memory: true
    cputemp: true
    disk: /mnt/storage
    units: metric
    tempmin: 30
    tempmax: 90

- search:
    provider: [google, duckduckgo]
    focus: true
    showSearchSuggestions: true
    target: _blank

- openmeteo:
    label: Temara
    latitude: 33.9263
    longitude: -6.9122
    timezone: Africa/Casablanca
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 1

- datetime:
    text_size: lg
    format:
      weekday: short
      day: numeric
      month: short
      hour: numeric
      minute: 2-digit
      hour12: true
