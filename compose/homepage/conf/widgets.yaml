---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- greeting:
    text_size: xl
    text: Potato homelab

- resources:
    label: lab2
    expanded: true
    cpu: true
    memory: true
    cputemp: true
    uptime: true
    units: metric
    tempmin: 30
    tempmax: 90

# /mnt/storage is the media disk, mounted read-only in docker-compose.yml.
- resources:
    label: Storage
    expanded: true
    disk:
      - /
      - /mnt/storage

- search:
    provider: [google, duckduckgo]
    focus: true
    showSearchSuggestions: true
    target: _blank

- openmeteo:
    label: Temara
    latitude: 33.9263
    longitude: -6.9122
    timezone: Africa/Casablanca
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 1

- datetime:
    text_size: xl
    format:
      dateStyle: medium
      timeStyle: short
      hour12: true
