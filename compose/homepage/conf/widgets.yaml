---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- greeting:
    text_size: xl
    text: Potato homelab

# lab2 itself, then its disks; Netdata has the detail.
- resources:
    label: lab2
    cpu: true
    memory: true
    cputemp: true
    uptime: true
    units: metric
    tempmin: 30
    tempmax: 90

# One widget per disk, so each has its name under it. /mnt/storage is the
# media disk, mounted read-only in docker-compose.yml.
- resources:
    label: System disk
    disk: /

- resources:
    label: Media disk
    disk: /mnt/storage
