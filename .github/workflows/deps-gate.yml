# Renovate merges the updates of the apps built here, majors too, only when this
# passes: each app's image builds, and its Dockerfile runs its tests and typecheck
# (renovate.json, ignoreTests: false). It runs on every Renovate branch, because
# Renovate never merges a gated branch that has no check. A failure leaves the
# branch unmerged, and the updater reports it in #updates.
name: deps-gate

on:
  push:
    branches: ["renovate/**"]
  workflow_dispatch:

# write: to merge a branch whose lock file was repaired here. The token is only
# handed to that one last step; the builds run without it.
permissions:
  contents: write

concurrency:
  group: deps-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --quiet origin main
      # Renovate leaves some package-lock.json files behind; npm ci would fail.
      - id: locks
        run: python3 updater/scripts/sync_locks.py origin/main | tee /dev/stderr | grep '^repaired=' >> "$GITHUB_OUTPUT" || true
      - run: python3 updater/scripts/ci_build.py origin/main
      # A repaired branch is not the commit Renovate made, so Renovate would not
      # merge it: merged here, on the same terms. The gateway's npm updates wait
      # for a person (renovate.json). Fast-forward only: if main has moved, this
      # refuses, and Renovate's rebase brings the branch back through this gate.
      - name: Merge the repaired branch
        if: steps.locks.outputs.repaired == 'true' && !contains(github.ref_name, 'pdf-gateway')
        env:
          TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main
