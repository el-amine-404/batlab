[project]
name = "batlab-common"
version = "1.0.0"
description = "Code shared by batlab's services: song titles, audio fingerprints, store previews, Apprise notifications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["batlab_common"]

[tool.setuptools.package-data]
batlab_common = ["senders.json"]
