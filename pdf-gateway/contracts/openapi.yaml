openapi: 3.1.0
info:
  title: Batlab PDF Security Gateway API
  version: 0.4.0
  description: Fail-closed contract. Quarantine artifacts are never browser-previewable.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /scans:
    post:
      operationId: createScan
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, intent]
              properties:
                file: {type: string, format: binary}
                intent: {enum: [SCAN_ONLY, ARCHIVE, ARCHIVE_AND_IMPORT]}
                cdrMode: {enum: [RASTER, RASTER_WITH_OCR], default: RASTER}
      responses:
        '202': {$ref: '#/components/responses/ScanAccepted'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '507': {$ref: '#/components/responses/Problem'}
    get:
      operationId: listScans
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Page of authorized scans, content: {application/json: {schema: {$ref: '#/components/schemas/ScanPage'}}}}}
  /scans/{scanId}:
    parameters: [{$ref: '#/components/parameters/ScanId'}]
    get:
      operationId: getScan
      responses: {'200': {description: Scan status, content: {application/json: {schema: {$ref: '#/components/schemas/Scan'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /scans/{scanId}/findings:
    parameters: [{$ref: '#/components/parameters/ScanId'}]
    get: {operationId: getScanFindings, responses: {'200': {description: Typed findings}, '404': {$ref: '#/components/responses/Problem'}}}
  /scans/{scanId}/report:
    parameters: [{$ref: '#/components/parameters/ScanId'}]
    get: {operationId: getScanReport, responses: {'200': {description: Versioned scan report}, '404': {$ref: '#/components/responses/Problem'}}}
  /scans/{scanId}/events:
    parameters: [{$ref: '#/components/parameters/ScanId'}]
    get: {operationId: streamScanEvents, responses: {'200': {description: Authorized SSE stream, content: {text/event-stream: {schema: {type: string}}}}, '404': {$ref: '#/components/responses/Problem'}}}
  /scans/{scanId}/rescan:
    parameters: [{$ref: '#/components/parameters/ScanId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post: {operationId: rescan, responses: {'202': {$ref: '#/components/responses/ScanAccepted'}, '409': {$ref: '#/components/responses/Problem'}}}
  /scans/{scanId}/cancel:
    parameters: [{$ref: '#/components/parameters/ScanId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post: {operationId: cancelScan, responses: {'202': {$ref: '#/components/responses/ScanAccepted'}, '409': {$ref: '#/components/responses/Problem'}}}
  /scans/{scanId}/paperless-import:
    parameters: [{$ref: '#/components/parameters/ScanId'}]
    post: {operationId: requestPaperlessImport, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'202': {description: Import queued}, '409': {$ref: '#/components/responses/Problem'}}}
    get: {operationId: getPaperlessImport, responses: {'200': {description: Import status}, '404': {$ref: '#/components/responses/Problem'}}}
  /artifacts/{artifactId}/download:
    parameters: [{$ref: '#/components/parameters/ArtifactId'}]
    get: {operationId: downloadApprovedArtifact, responses: {'200': {description: Approved artifact only, headers: {X-Content-Type-Options: {schema: {const: nosniff}}}, content: {application/pdf: {schema: {type: string, format: binary}}}}, '404': {$ref: '#/components/responses/Problem'}}}
  /archive:
    get: {operationId: listArchive, parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {description: Portable archive page}}}
  /archive/verify:
    post: {operationId: verifyArchive, x-required-role: ADMIN, security: [{sessionCookie: []}], parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'202': {description: Verification queued}}}
  /archive/reindex:
    post: {operationId: reindexArchive, x-required-role: ADMIN, security: [{sessionCookie: []}], parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'202': {description: Reindex queued}}}
  /archive/{documentId}:
    parameters: [{$ref: '#/components/parameters/DocumentId'}]
    get: {operationId: getArchiveDocument, responses: {'200': {description: Archive document}, '404': {$ref: '#/components/responses/Problem'}}}
  /archive/{documentId}/metadata:
    parameters: [{$ref: '#/components/parameters/DocumentId'}]
    get: {operationId: getArchiveMetadata, responses: {'200': {description: Validated portable sidecar}, '404': {$ref: '#/components/responses/Problem'}}}
    patch:
      operationId: updateArchiveMetadata
      description: Sidecar-only edit (never rewrites the PDF). Queued for the archive's single writer, which applies it by compare-and-swap on the revision in If-Match ("rev-N"). Editable fields are title and tags.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                title: {type: string, minLength: 1, maxLength: 200}
                tags: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}}
      responses:
        '202': {description: Edit queued; poll the Location (edit status)}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /archive/{documentId}/edits/{editId}:
    parameters: [{$ref: '#/components/parameters/DocumentId'}, {name: editId, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: getArchiveEdit, responses: {'200': {description: Edit status PENDING, APPLIED, CONFLICT or INVALID with resulting revision}, '404': {$ref: '#/components/responses/Problem'}}}
  /archive/{documentId}/reissue:
    parameters: [{$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post: {operationId: reissueArchivePdf, responses: {'202': {description: New immutable version queued}, '409': {$ref: '#/components/responses/Problem'}}}
  /archive/{documentId}/file:
    parameters: [{$ref: '#/components/parameters/DocumentId'}]
    get: {operationId: getArchiveFile, responses: {'200': {description: Current approved PDF}, '404': {$ref: '#/components/responses/Problem'}}}
  /archive/{documentId}/sidecar:
    parameters: [{$ref: '#/components/parameters/DocumentId'}]
    get: {operationId: getArchiveSidecar, responses: {'200': {description: Current metadata.json}, '404': {$ref: '#/components/responses/Problem'}}}
  /session:
    description: Browser session for the web UI. POST exchanges an API token for an HttpOnly, Secure, SameSite=Strict __Host- cookie and returns a CSRF token. Cookie-authenticated unsafe requests must send it as X-CSRF-Token and a same-origin Origin (or none); bearer-token requests need neither.
    post: {operationId: createSession, security: [], responses: {'201': {description: Session created; Set-Cookie and csrfToken}, '401': {$ref: '#/components/responses/Problem'}}}
    get: {operationId: getSession, responses: {'200': {description: Current user, role, csrfToken and expiry}, '401': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: deleteSession, responses: {'204': {description: Session revoked and cookie cleared}, '403': {$ref: '#/components/responses/Problem'}}}
  /dashboard/summary:
    get: {operationId: getDashboardSummary, responses: {'200': {description: Authorized aggregate data}}}
  /dashboard/timeseries:
    get: {operationId: getDashboardTimeseries, responses: {'200': {description: Authorized aggregate time series}}}
  /quarantine:
    get: {operationId: listQuarantine, x-required-role: ADMIN, security: [{sessionCookie: []}], responses: {'200': {description: Metadata only; no raw preview URLs}}}
  /quarantine/{id}:
    delete: {operationId: deleteQuarantineItem, x-required-role: ADMIN, security: [{sessionCookie: []}], parameters: [{name: id, in: path, required: true, schema: {type: string, pattern: '^quar-[0-9A-HJKMNP-TV-Z]{26}$'}}, {$ref: '#/components/parameters/IfMatch'}], responses: {'204': {description: Deleted and audited}, '412': {$ref: '#/components/responses/Problem'}}}
  /system/health:
    get: {operationId: getSystemHealth, responses: {'200': {description: Dependency health without secrets}}}
  /system/scanners:
    get: {operationId: getScanners, responses: {'200': {description: Versions, freshness, and availability}}}
  /system/workers:
    get: {operationId: getWorkers, responses: {'200': {description: Worker health and queue lag}}}
  /settings:
    get: {operationId: getSettings, x-required-role: ADMIN, security: [{sessionCookie: []}], responses: {'200': {description: Redacted settings}}}
    patch: {operationId: updateSettings, x-required-role: ADMIN, security: [{sessionCookie: []}], parameters: [{$ref: '#/components/parameters/IfMatch'}], responses: {'200': {description: Updated and audited}, '412': {$ref: '#/components/responses/Problem'}}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: PDF_GATEWAY_SESSION}
    bearerToken: {type: http, scheme: bearer, bearerFormat: opaque-capability}
  parameters:
    ScanId: {name: scanId, in: path, required: true, schema: {type: string, pattern: '^scan-[0-9A-HJKMNP-TV-Z]{26}$'}}
    ArtifactId: {name: artifactId, in: path, required: true, schema: {type: string, pattern: '^art-[0-9A-HJKMNP-TV-Z]{26}$'}}
    DocumentId: {name: documentId, in: path, required: true, schema: {type: string, pattern: '^doc-[0-9A-HJKMNP-TV-Z]{26}$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"rev-[1-9][0-9]*"$'}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
  responses:
    Problem: {description: Typed failure, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    ScanAccepted: {description: Durable job accepted, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ScanAccepted'}}}}
  schemas:
    ScanAccepted:
      type: object
      additionalProperties: false
      required: [scanId, status, statusUrl, eventsUrl]
      properties:
        scanId: {type: string, pattern: '^scan-[0-9A-HJKMNP-TV-Z]{26}$'}
        status: {const: QUEUED}
        statusUrl: {type: string}
        eventsUrl: {type: string}
    Scan:
      type: object
      additionalProperties: false
      required: [scanId, displayName, status, stage, detection, policy, artifact, originalRetention, importStatus, sourceBytes, sourceSha256, createdAt, updatedAt]
      properties:
        scanId: {type: string}
        displayName: {type: string, maxLength: 255, description: 'Untrusted upload filename; clients must render it as plain text only.'}
        status: {enum: [RECEIVED, QUARANTINED, QUEUED, SCANNING, ANALYZING, AWAITING_POLICY, SANITIZING, VALIDATING_OUTPUT, ARCHIVING, READY, REVIEW_REQUIRED, BLOCKED, FAILED, CANCELLED]}
        stage: {type: string, pattern: '^[A-Z][A-Z_]{2,31}$', description: 'Exact internal pipeline state, for diagnostics only; clients act on status.'}
        detection: {enum: [NO_THREATS_DETECTED, SUSPICIOUS, MALICIOUS, UNKNOWN]}
        policy: {enum: [ALLOW_SANITIZED, REVIEW_REQUIRED, BLOCK, CDR_ELIGIBLE], description: 'CDR_ELIGIBLE means sanitization may run; only ALLOW_SANITIZED follows final validation of the exact output bytes.'}
        artifact: {enum: [ORIGINAL_QUARANTINED, SANITIZED_STAGED, FINAL_VALIDATED, PUBLISHED]}
        originalRetention: {enum: [STANDARD, SIGNED_RESTRICTED], description: 'SIGNED_RESTRICTED preserves a cryptographically signed original as evidence; any viewing copy is unsigned.'}
        importStatus: {enum: [NOT_REQUESTED, PENDING, IMPORTING, IMPORTED, FAILED_RETRYABLE, FAILED_FINAL]}
        sourceBytes: {type: integer, minimum: 1}
        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ScanPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Scan'}}
        nextCursor: {type: [string, 'null']}
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string, format: uri}
        title: {type: string, maxLength: 200}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, maxLength: 1000}
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}
        traceId: {type: string, maxLength: 80}

