name: pdf-security-gateway

services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    cpus: 0.5
    mem_limit: 512m
    environment:
      POSTGRES_DB: pdf_gateway
      POSTGRES_USER: pdf_gateway
      POSTGRES_PASSWORD: ${PDF_GATEWAY_DATABASE_PASSWORD:?set in the deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdf_gateway -d pdf_gateway"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4.1-alpine@sha256:3dd4ce7606f9fbf2e2dbca90a02f29c19c5cdf66bf15cdf5237430e3614128ca
    cpus: 0.5
    mem_limit: 512m
    environment:
      # Erlang schedulers busy-wait by default; that burns idle CPU on a shared host.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +sbwt none +sbwtdcpu none +sbwtdio none
      RABBITMQ_DEFAULT_USER: pdf_gateway
      RABBITMQ_DEFAULT_PASS: ${PDF_GATEWAY_RABBITMQ_PASSWORD:?set in the deployment environment}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [backend]

  api:
    build:
      context: api
    environment:
      PDF_GATEWAY_DATABASE_PASSWORD: ${PDF_GATEWAY_DATABASE_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_RABBITMQ_PASSWORD: ${PDF_GATEWAY_RABBITMQ_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_BOOTSTRAP_ADMIN_TOKEN: ${PDF_GATEWAY_BOOTSTRAP_ADMIN_TOKEN:?set in the deployment environment}
      PDF_GATEWAY_STORAGE_ROOT: /var/lib/pdf-gateway
      PDF_GATEWAY_MULTIPART_DIR: /var/lib/pdf-gateway/multipart
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    volumes:
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}:/var/lib/pdf-gateway
    ports:
      - 127.0.0.1:${PDF_GATEWAY_API_PORT:-18089}:8080
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/internal/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [backend, edge]

  clamav:
    profiles: [scanning]
    image: clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    volumes:
      - clamav-definitions:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    mem_limit: 4g
    cpus: 1.0
    pids_limit: 128
    networks: [backend, updates]

  analysis-worker:
    profiles: [scanning]
    build:
      context: analysis-worker
    environment:
      PDF_GATEWAY_DATABASE_HOST: postgres
      PDF_GATEWAY_DATABASE_NAME: pdf_gateway
      PDF_GATEWAY_DATABASE_USER: pdf_gateway
      PDF_GATEWAY_DATABASE_PASSWORD: ${PDF_GATEWAY_DATABASE_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_RABBITMQ_HOST: rabbitmq
      PDF_GATEWAY_RABBITMQ_USER: pdf_gateway
      PDF_GATEWAY_RABBITMQ_PASSWORD: ${PDF_GATEWAY_RABBITMQ_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_CLAMD_HOST: clamav
      PDF_GATEWAY_STORAGE_ROOT: /var/lib/pdf-gateway
      PDF_GATEWAY_SCAN_MAX_ATTEMPTS: ${PDF_GATEWAY_SCAN_MAX_ATTEMPTS:-3}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      clamav: {condition: service_healthy}
    volumes:
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/quarantine:/var/lib/pdf-gateway/quarantine:ro
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/reports:/var/lib/pdf-gateway/reports
      # Untrusted native text of CDR-eligible originals (organisation and content.txt only).
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/text-extracts:/var/lib/pdf-gateway/text-extracts
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [backend]

  signature-worker:
    profiles: [scanning]
    build:
      context: signature-worker
    entrypoint: ["python", "/opt/pdf-gateway/worker.py"]
    environment:
      PDF_GATEWAY_DATABASE_HOST: postgres
      PDF_GATEWAY_DATABASE_NAME: pdf_gateway
      PDF_GATEWAY_DATABASE_USER: pdf_gateway
      PDF_GATEWAY_DATABASE_PASSWORD: ${PDF_GATEWAY_DATABASE_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_RABBITMQ_HOST: rabbitmq
      PDF_GATEWAY_RABBITMQ_USER: pdf_gateway
      PDF_GATEWAY_RABBITMQ_PASSWORD: ${PDF_GATEWAY_RABBITMQ_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_STORAGE_ROOT: /var/lib/pdf-gateway
      PDF_GATEWAY_SIGNATURE_TRUST_ROOTS: ${PDF_GATEWAY_SIGNATURE_TRUST_ROOTS:-}
      PDF_GATEWAY_SIGNATURE_MAX_ATTEMPTS: ${PDF_GATEWAY_SIGNATURE_MAX_ATTEMPTS:-3}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    volumes:
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/quarantine:/var/lib/pdf-gateway/quarantine:ro
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/signature-reports:/var/lib/pdf-gateway/signature-reports
      - ./trust:/trust:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [backend]

  # Dispatches to the host Dangerzone provider (hosts/lab2/pdf-cdr-provider)
  # over a Unix socket. The sandbox boundary is the provider's rootless
  # Podman + gVisor runtime, never this container; no Docker socket is mounted.
  cdr-worker:
    profiles: [cdr]
    build:
      context: cdr-worker
    environment:
      PDF_GATEWAY_DATABASE_HOST: postgres
      PDF_GATEWAY_DATABASE_NAME: pdf_gateway
      PDF_GATEWAY_DATABASE_USER: pdf_gateway
      PDF_GATEWAY_DATABASE_PASSWORD: ${PDF_GATEWAY_DATABASE_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_RABBITMQ_HOST: rabbitmq
      PDF_GATEWAY_RABBITMQ_USER: pdf_gateway
      PDF_GATEWAY_RABBITMQ_PASSWORD: ${PDF_GATEWAY_RABBITMQ_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_STORAGE_ROOT: /var/lib/pdf-gateway
      PDF_GATEWAY_CDR_SOCKET: /run/pdf-cdr/cdr.sock
      PDF_GATEWAY_CDR_MAX_ATTEMPTS: ${PDF_GATEWAY_CDR_MAX_ATTEMPTS:-4}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    volumes:
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/quarantine:/var/lib/pdf-gateway/quarantine:ro
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/cdr-output:/var/lib/pdf-gateway/cdr-output
      - ${PDF_GATEWAY_CDR_SOCKET_DIR:?set to the provider socket directory}:/run/pdf-cdr
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [backend]

  # Final validation of exact CDR output bytes; the only path to ALLOW_SANITIZED.
  # Requires the scanning profile's ClamAV.
  validation-worker:
    profiles: [cdr]
    build:
      context: analysis-worker
    entrypoint: ["python3", "/opt/pdf-gateway/validation_worker.py"]
    # Read access to staged CDR output (files 0640, group 10010).
    group_add: ["10010"]
    environment:
      PDF_GATEWAY_DATABASE_HOST: postgres
      PDF_GATEWAY_DATABASE_NAME: pdf_gateway
      PDF_GATEWAY_DATABASE_USER: pdf_gateway
      PDF_GATEWAY_DATABASE_PASSWORD: ${PDF_GATEWAY_DATABASE_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_RABBITMQ_HOST: rabbitmq
      PDF_GATEWAY_RABBITMQ_USER: pdf_gateway
      PDF_GATEWAY_RABBITMQ_PASSWORD: ${PDF_GATEWAY_RABBITMQ_PASSWORD:?set in the deployment environment}
      PDF_GATEWAY_CLAMD_HOST: clamav
      PDF_GATEWAY_STORAGE_ROOT: /var/lib/pdf-gateway
      PDF_GATEWAY_VALIDATION_MAX_ATTEMPTS: ${PDF_GATEWAY_VALIDATION_MAX_ATTEMPTS:-3}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      clamav: {condition: service_healthy}
    volumes:
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/quarantine:/var/lib/pdf-gateway/quarantine:ro
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/cdr-output:/var/lib/pdf-gateway/cdr-output:ro
      - ${PDF_GATEWAY_STORAGE_ROOT:?set to a private host directory}/validation-reports:/var/lib/pdf-gateway/validation-reports
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [backend]

volumes:
  postgres-data: {}
  rabbitmq-data: {}
  clamav-definitions: {}

networks:
  backend:
    internal: true
  edge: {}
  updates: {}
