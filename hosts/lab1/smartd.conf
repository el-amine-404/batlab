# smartd on lab1, installed as /etc/smartd.conf. Replaces Debian's DEVICESCAN
# line: USB device names move between reboots, so every disk is named by its
# serial number under /dev/disk/by-id, and each carries the limits that suit it.
#
# Shared directives:
#   -d sat            all three disks answer through a SATA-to-USB or AHCI bridge
#   -a                monitor everything smartd knows how to monitor
#   -n standby,q      never spin a sleeping disk up just to read it
#   no -o/-S          none of the three bridges or disks accept offline data
#                     collection, and smartd warns on every start if asked
#   -m <nomailer>     no mail; 10mail exits at once and 20discord posts instead
#   -M exec …runner   run /etc/smartmontools/run.d: 10mail, then 20discord
#
# Self-tests run in the disk's own firmware, so they cost no CPU and survive a
# reboot of the host. They are staggered to keep two disks from testing at once.

# Root SSD. WD Green SSDs report no pending-sector or uncorrectable counts, so
# the health check and the error log carry the warning. The disk reports no
# auto-offline support, so that directive is left off here too.
#
# Temperature: smartd's log prints the normalized value of attribute 194, which
# for these WD SSDs is 100 minus the temperature, so a logged "73" is 27 C. The
# -W limits below are read as real degrees. Measured 28 C, hottest ever 50 C;
# WD rates the drive to 70 C.
/dev/disk/by-id/ata-WDC_WDS240G2G0A-00JH30_20413A800758 -d sat -a -n standby,q \
  -s (S/../.././02|L/../01/./03) -W 4,55,65 \
  -m <nomailer> -M exec /usr/share/smartmontools/smartd-runner

# The 4 TB data disk: every photo, document and media file. A Toshiba HDWT840 in
# a JMicron JMS578 enclosure, which is why it is on a USB 2.0 port. Toshiba rates
# it to 55 C, so warn at 50 and alarm at 55. Offline tests and attribute autosave
# are left off because the bridge does not pass them reliably.
/dev/disk/by-id/ata-TOSHIBA_HDWT840_X5U3S8Y3SRUL -d sat -a -n standby,q \
  -s (S/../.././03|L/../15/./04) -W 4,50,55 \
  -m <nomailer> -M exec /usr/share/smartmontools/smartd-runner

# Second SSD, in a KESU USB enclosure, holding the batlab-data partition. Its
# bridge refuses the SMART health check, so attributes and the error log are all
# smartd can watch here. Same model as the root SSD, so the same limits apply.
/dev/disk/by-id/ata-WDC_WDS240G2G0A-00JH30_1926EK445614 -d sat -a -n standby,q \
  -s (S/../.././05) -W 4,55,65 \
  -m <nomailer> -M exec /usr/share/smartmontools/smartd-runner
