# Disables the go.d docker collector. On Docker 29 with the containerd image
# store every API poll also walks containerd: at the default 1 s interval that
# held dockerd and containerd at ~75% of a core each and the CPU at 85 C, and
# even a 60 s interval cost ~9% of a core. Per-container CPU, memory and
# network charts come from the cgroups plugin and are unaffected.
jobs: []
