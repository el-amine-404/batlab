# Install as /etc/systemd/system/batlab-mediascan-deep.service.d/limits.conf.
# One 10 s sample decode took this CPU from 79 to 87 C in 31 s, so the pass
# gets a single core and stops starting new files above the 85 C alert line.
[Service]
CPUQuota=100%
Environment=MEDIASCAN_MAX_CPU_TEMP=85
Environment=MEDIASCAN_CPU_TEMP_SENSOR=k10temp
