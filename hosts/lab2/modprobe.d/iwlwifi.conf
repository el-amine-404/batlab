# lab2's Intel 8265 misses the router's beacons on a_2.4 and, with power
# saving on, drops the link every 15-25 s ("Connection to AP lost", reason 4).
# Tested 2026-10-11, 60 s of pings each: 20 MHz alone lost 53%; this plus
# disable_ht40=1 in the wpa_supplicant config lost 0% with no drops. The
# "missed beacons exceeds threshold, but receiving data" warnings remain.
options iwlwifi power_save=0
options iwlmvm power_scheme=1
