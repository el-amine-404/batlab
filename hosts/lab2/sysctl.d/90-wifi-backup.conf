# Two interfaces on 192.168.1.0/24 (network/wlp2s0).
# Skip routes whose interface has no link, so an unplugged cable hands over to
# the Wi-Fi routes at metric 600.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
# Answer ARP only for addresses on the interface asked, and announce from the
# outgoing interface's own address: otherwise clients may learn .201 at the
# Wi-Fi MAC and reach lab2 over the air with the cable plugged in.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
# Loose reverse-path filtering: a reply may leave by the other interface.
net.ipv4.conf.all.rp_filter = 2
