# Install as /etc/systemd/system/batlab-mediascan-deep.service.d/limits.conf.
# Looser than lab1's single core: two of the eight threads, and no new file is
# started while the CPU averages above 90 C. Loosen after a week of Netdata.
[Service]
CPUQuota=200%
Environment=MEDIASCAN_MAX_CPU_TEMP=90
Environment=MEDIASCAN_CPU_TEMP_SENSOR=coretemp
