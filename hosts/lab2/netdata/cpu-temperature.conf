# Intel i5-8350U: Tjmax 100 C, and the CPU throttles itself before that. A thin
# laptop chassis, so sustained load is still worth an alert.
 template: batlab_cpu_temperature
       on: system.hw.sensor.temperature.input
chart labels: driver=coretemp
   lookup: average -5m unaligned of input
    units: Celsius
    every: 1m
     warn: $this > (($status >= $WARNING)  ? (85) : (90))
     crit: $this > (($status == $CRITICAL) ? (90) : (95))
    delay: down 10m multiplier 1.5 max 1h
  summary: CPU temperature
     info: CPU temperature averaged over 5 minutes
       to: sysadmin
