# Enabled on lab2 as a trial: on lab1 this collector held dockerd and containerd
# at ~75% of a core each (see hosts/lab1/netdata/go.d-docker.conf). Watch
# app.dockerd CPU for a week; if it costs more than a few percent, replace this
# file with lab1's `jobs: []`.
jobs:
  - name: local
    address: unix:///var/run/docker.sock
    update_every: 10
