# smartd on lab2, installed as /etc/smartd.conf. Replaces Debian's DEVICESCAN
# line: USB device names move between reboots, so every disk is named by its
# serial number under /dev/disk/by-id. Shared directives are explained in
# hosts/lab1/smartd.conf. Check each disk once with `sudo smartctl -a <id>` after
# installing: lab2's internal SSD has not been read with smartctl yet.

# Root SSD, internal SATA: SanDisk SD9SN8W 256 GB. SanDisk rates it to 70 C.
/dev/disk/by-id/ata-SanDisk_SD9SN8W-256G-1016_184632807112 -d sat -a -n standby,q \
  -s (S/../.././02|L/../01/./03) -W 4,55,65 \
  -m <nomailer> -M exec /usr/share/smartmontools/smartd-runner

# The 4 TB data disk, moved from lab1 in its JMicron JMS578 enclosure. Toshiba
# rates it to 55 C, so warn at 50 and alarm at 55. Offline tests and attribute
# autosave stay off because the bridge does not pass them reliably.
/dev/disk/by-id/ata-TOSHIBA_HDWT840_X5U3S8Y3SRUL -d sat -a -n standby,q \
  -s (S/../.././03|L/../15/./04) -W 4,50,55 \
  -m <nomailer> -M exec /usr/share/smartmontools/smartd-runner
